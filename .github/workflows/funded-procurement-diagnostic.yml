name: Funded Procurement Investment Backtest

on:
  push:
    branches: [phase0-funded-procurement-diagnostic]

permissions:
  contents: read

jobs:
  backtest:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq poppler-utils
          pip install pandas openpyxl requests
      - name: Run investment-level public-observability backtest
        shell: bash
        run: |
          set +e
          python phase0_funded_procurement_investment_backtest.py
          rc=$?
          set -e
          echo "$rc" > /tmp/funded_procurement_investment_exit.txt
          if [ "$rc" -ne 0 ] && [ "$rc" -ne 2 ]; then exit "$rc"; fi
      - name: Upload result
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: funded-procurement-investment-backtest
          retention-days: 30
          if-no-files-found: warn
          path: |
            /tmp/funded_procurement_investment_backtest.json
            /tmp/funded_procurement_investment_exit.txt
