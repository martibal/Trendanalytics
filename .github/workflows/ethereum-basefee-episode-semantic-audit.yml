name: Ethereum Basefee Episode Semantic Audit

on:
  workflow_dispatch:
  push:
    branches:
      - agent/ethereum-basefee-episode-semantic-audit
    paths:
      - .github/workflows/ethereum-basefee-episode-semantic-audit.yml

permissions:
  contents: read

concurrency:
  group: ethereum-basefee-episode-semantic-audit-${{ github.ref }}
  cancel-in-progress: true

jobs:
  audit:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install pandas numpy

      - name: Run basefee episode semantic audit
        shell: bash
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          import pandas as pd
          import api.regime_engine as engine

          gold_root = Path('data/published/v1/gold/ethereum')
          meta_root = Path('data/published/v1/meta/ethereum')
          gold_paths = sorted(gold_root.glob('????-??-??.json'))
          if len(gold_paths) != 617:
              raise SystemExit(f'expected 617 Ethereum Gold days, got {len(gold_paths)}')

          rows = []
          for p in gold_paths:
              obj = json.loads(p.read_text(encoding='utf-8'))
              obj.setdefault('date', p.stem)
              rows.append(obj)
          df = pd.DataFrame(rows)
          df['date'] = pd.to_datetime(df['date'], errors='coerce')
          df = df.dropna(subset=['date']).sort_values('date').reset_index(drop=True)

          dates = pd.date_range('2026-04-20', '2026-05-05', freq='D')
          out = []
          candidate_dates = {'2026-04-27','2026-04-28','2026-04-29','2026-04-30','2026-05-02'}

          for dt in dates:
              day = dt.date().isoformat()
              idx = df.index[df['date'] == dt]
              if len(idx) != 1:
                  raise SystemExit(f'missing/duplicate Gold day {day}')
              i = int(idx[0])
              sub = df.iloc[:i+1].copy()
              meta = json.loads((meta_root / f'{day}.json').read_text(encoding='utf-8'))
              regime = meta.get('regime') or {}
              if regime.get('ruleset_id') != 'eth_l1_v2':
                  raise SystemExit(f'unexpected ruleset on {day}: {regime.get("ruleset_id")}')

              confidence = (meta.get('confidence') or {}).get('confidence_score')
              ev = engine.compute_regime(
                  sub,
                  chain='ethereum',
                  profile={'type':'eth_l1'},
                  asof_date=day,
                  confidence_score=confidence,
              )
              axes = ev.get('axes') or {}
              basefee = engine._signal_for_metric(sub, 'median_block_base_fee_per_gas') or {}
              medfee = engine._signal_for_metric(sub, 'median_tx_fee_native') or {}
              failed = engine._signal_for_metric(sub, 'failed_tx_rate') or {}
              gasutil = engine._signal_for_metric(sub, 'gas_utilization_pct') or {}

              def compact(sig):
                  return {
                      'current': sig.get('current'),
                      'band': sig.get('band'),
                      'pct_90d': sig.get('pct_90d'),
                      'z_robust': sig.get('z_robust'),
                      'trend': sig.get('trend'),
                      'momentum_7d_vs_30d': sig.get('momentum_7d_vs_30d'),
                      'informative': sig.get('informative'),
                  }

              basefee_consensus = (
                  bool(basefee.get('informative', False))
                  and float(basefee.get('pct_90d', 50.0)) >= 80.0
                  and float(basefee.get('z_robust', 0.0)) >= 1.5
              )

              out.append({
                  'date': day,
                  'is_candidate': day in candidate_dates,
                  'published_label': regime.get('label'),
                  'recomputed_label': ev.get('label'),
                  'confidence': confidence,
                  'demand_axis': axes.get('demand'),
                  'friction_axis': axes.get('friction'),
                  'capacity_axis': axes.get('capacity'),
                  'basefee_consensus_high': basefee_consensus,
                  'basefee': compact(basefee),
                  'median_tx_fee_native': compact(medfee),
                  'failed_tx_rate': compact(failed),
                  'gas_utilization_pct': compact(gasutil),
                  'drivers': ev.get('drivers'),
              })

          candidate_rows = [r for r in out if r['is_candidate']]
          if len(candidate_rows) != 5:
              raise SystemExit(f'expected 5 candidate rows, got {len(candidate_rows)}')
          if any(r['published_label'] != 'CHEAP' for r in candidate_rows):
              raise SystemExit('all five candidate dates must have published CHEAP baseline')

          report = {
              'scope': {'start': out[0]['date'], 'end': out[-1]['date'], 'days': len(out)},
              'question': 'Do the five 5d-persistent basefee candidates contradict published CHEAP once core Friction and Capacity evidence are inspected?',
              'candidate_metric': 'median_block_base_fee_per_gas',
              'candidate_dates': sorted(candidate_dates),
              'candidate_rows': candidate_rows,
              'window': out,
              'guardrails': [
                  'Observational only; no production files modified.',
                  'Published labels remain the baseline.',
                  'Basefee is separate Friction evidence; core ETH v2 axes remain unchanged.',
              ],
          }
          Path('ethereum-basefee-episode-semantic-audit.json').write_text(
              json.dumps(report, indent=2, sort_keys=True) + '\n', encoding='utf-8'
          )
          print(json.dumps(report, indent=2, sort_keys=True))
          PY

      - name: Upload audit report
        uses: actions/upload-artifact@v4
        with:
          name: ethereum-basefee-episode-semantic-audit
          path: ethereum-basefee-episode-semantic-audit.json
          if-no-files-found: error
          retention-days: 7
