name: Ethereum Native Unit PR Check

on:
  pull_request:
    branches:
      - main
    paths:
      - "data/published/v1/**"
      - "web-v1-app/.private-data/published/v1/**"
      - "pipeline/tools/validate_native_units.py"

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web-v1-app/package-lock.json
      - name: Validate Ethereum native units
        run: python pipeline/tools/validate_native_units.py --published-root data/published/v1
      - name: Install web dependencies
        working-directory: web-v1-app
        run: npm ci
      - name: Run publication integrity audit
        working-directory: web-v1-app
        run: npm run check:publication-integrity
