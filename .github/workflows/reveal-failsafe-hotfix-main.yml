name: Apply Reveal failsafe hotfix

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/reveal-failsafe-hotfix-main.yml

permissions:
  contents: write

jobs:
  patch-and-verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Patch Reveal failsafe
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('web-v1-app/src/components/landing/UrdAtlasVFinalLandingClient.tsx')
          text = path.read_text(encoding='utf-8')

          observe = '    observer.observe(node);\n\n    const handleHashChange = () => {'
          replacement = '    observer.observe(node);\n\n    const failsafeTimer = setTimeout(reveal, 1500);\n\n    const handleHashChange = () => {'
          if 'const failsafeTimer = setTimeout(reveal, 1500);' not in text:
              if observe not in text:
                  raise SystemExit('Reveal observer insertion point not found')
              text = text.replace(observe, replacement, 1)

          cleanup = '      observer.disconnect();\n      window.removeEventListener("hashchange", handleHashChange);\n'
          cleanup_replacement = '      observer.disconnect();\n      window.removeEventListener("hashchange", handleHashChange);\n      clearTimeout(failsafeTimer);\n'
          if 'clearTimeout(failsafeTimer);' not in text:
              if cleanup not in text:
                  raise SystemExit('Reveal cleanup insertion point not found')
              text = text.replace(cleanup, cleanup_replacement, 1)

          path.write_text(text, encoding='utf-8')
          PY

      - name: Verify source patch
        run: |
          grep -F 'const failsafeTimer = setTimeout(reveal, 1500);' web-v1-app/src/components/landing/UrdAtlasVFinalLandingClient.tsx
          grep -F 'clearTimeout(failsafeTimer);' web-v1-app/src/components/landing/UrdAtlasVFinalLandingClient.tsx

      - name: Install dependencies
        working-directory: web-v1-app
        run: npm ci

      - name: Install Chromium
        working-directory: web-v1-app
        run: npx playwright install --with-deps chromium

      - name: Typecheck
        working-directory: web-v1-app
        run: npm run typecheck

      - name: Run existing mobile homepage E2E
        working-directory: web-v1-app
        run: npm run test:e2e -- mobile-home.spec.ts

      - name: Add temporary Reveal failsafe E2E
        run: |
          cat > web-v1-app/tests/e2e/reveal-failsafe-temp.spec.ts <<'EOF'
          import { expect, test } from "@playwright/test";

          async function assertAllRevealContentVisible(page: import("@playwright/test").Page) {
            const reveals = page.locator(".ua-vf-reveal");
            const count = await reveals.count();
            expect(count).toBeGreaterThan(0);
            for (let index = 0; index < count; index += 1) {
              await expect(reveals.nth(index)).toHaveCSS("opacity", "1");
            }
          }

          test("fast scroll with 4x CPU throttling never leaves Reveal content hidden", async ({ page }) => {
            const session = await page.context().newCDPSession(page);
            await session.send("Emulation.setCPUThrottlingRate", { rate: 4 });
            await page.goto("/", { waitUntil: "domcontentloaded" });
            await page.evaluate(() => window.scrollTo(0, document.documentElement.scrollHeight));
            await page.waitForTimeout(1800);
            await assertAllRevealContentVisible(page);
          });

          test("failsafe reveals content when IntersectionObserver never fires", async ({ page }) => {
            await page.addInitScript(() => {
              class NoopIntersectionObserver {
                readonly root = null;
                readonly rootMargin = "0px";
                readonly thresholds = [0.16];
                constructor(_callback: IntersectionObserverCallback, _options?: IntersectionObserverInit) {}
                observe() {}
                unobserve() {}
                disconnect() {}
                takeRecords() { return []; }
              }
              Object.defineProperty(window, "IntersectionObserver", {
                configurable: true,
                writable: true,
                value: NoopIntersectionObserver,
              });
            });
            await page.goto("/", { waitUntil: "domcontentloaded" });
            await page.waitForTimeout(1800);
            await assertAllRevealContentVisible(page);
          });
          EOF

      - name: Run Reveal failsafe E2E
        working-directory: web-v1-app
        run: npm run test:e2e -- reveal-failsafe-temp.spec.ts

      - name: Clean temporary test and workflow, then commit fix
        run: |
          rm -f web-v1-app/tests/e2e/reveal-failsafe-temp.spec.ts
          git rm .github/workflows/reveal-failsafe-hotfix-main.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add web-v1-app/src/components/landing/UrdAtlasVFinalLandingClient.tsx
          git commit -m '[skip ci] fix: guarantee Reveal content becomes visible'
          git push origin HEAD:main
