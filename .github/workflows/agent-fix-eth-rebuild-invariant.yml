name: Agent Fix Ethereum Rebuild Invariant

on:
  push:
    branches:
      - agent/ethereum-history-rebuild-run
    paths:
      - .github/workflows/agent-fix-eth-rebuild-invariant.yml

jobs:
  patch:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/ethereum-history-rebuild-run
          fetch-depth: 0
          persist-credentials: true
      - name: Apply patch
        run: |
          python .agent/fix_eth_rebuild_invariant.py
          python - <<'PY'
          from pathlib import Path
          s=Path('.github/workflows/agent-ethereum-history-rebuild.yml').read_text()
          assert "web-v1-app/\\.private-data/published/v1/(gold|derived|meta)/(bitcoin|arbitrum|base)" not in s
          assert "web-v1-app/.private-data/published/v1/gold/ethereum" in s
          print('targeted invariant assertions passed')
          PY
      - name: Commit patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          rm .agent/fix_eth_rebuild_invariant.py
          git add .github/workflows/agent-ethereum-history-rebuild.yml .agent/fix_eth_rebuild_invariant.py
          git commit -m "Fix Ethereum-only rebuild invariant scope"
          git push origin HEAD:agent/ethereum-history-rebuild-run
