name: AWS Ethereum Raw Source Dry Run

on:
  workflow_dispatch:

jobs:
  probe:
    runs-on: windows-latest
    timeout-minutes: 20

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Verify AWS CLI
        shell: pwsh
        run: |
          aws --version

      - name: Probe Ethereum source availability
        shell: pwsh
        run: |
          Write-Host "=== Direct S3 prefix listing: ethereum blocks ==="
          aws s3 ls s3://aws-public-blockchain/v1.0/eth/blocks/ --no-sign-request |
            Select-String "2026-06-18|2026-06-19|2026-06-20|2026-06-21|2026-06-22|2026-06-23"

          Write-Host "`n=== Direct S3 prefix listing: ethereum transactions ==="
          aws s3 ls s3://aws-public-blockchain/v1.0/eth/transactions/ --no-sign-request |
            Select-String "2026-06-18|2026-06-19|2026-06-20|2026-06-21|2026-06-22|2026-06-23"

          Write-Host "`n=== Downloader dry-run: ethereum only ==="
          python .\pipeline\tools\download_up_to_date_minimal.py `
            --root . `
            --raw-root .\data\raw `
            --published-root .\data\published\v1 `
            --start 2026-06-18 `
            --chains ethereum `
            --lag-l1-days 1 `
            --lag-l2-days 7 `
            --dry-run

          Write-Host "`n=== Dry-run report ==="
          Get-Content .\reports\download_up_to_date_minimal.json -Raw
