name: Validation sensitivity and ablation

on:
  push:
    branches:
      - agent/validation-sensitivity-ablation-20260812
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Run validation audit
        run: PYTHONPATH=. python scripts/validation_sensitivity_ablation_v2.py
      - name: Upload validation report
        uses: actions/upload-artifact@v4
        with:
          name: validation-sensitivity-ablation
          path: validation-output/
          retention-days: 7
