name: Temporary homepage sales-pitch patch

on:
  push:
    branches:
      - docs/home-regime-sales-pitch

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: docs/home-regime-sales-pitch
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Apply targeted homepage patch
        run: python scripts/tmp_patch_home_sales_pitch.py
      - name: Validate targeted copy
        run: |
          grep -q "One daily network regime" web-v1-app/src/components/home/InteractiveHomeDashboard.tsx
          grep -q "You could build this yourself" web-v1-app/src/components/home/InteractiveHomeDashboard.tsx
          ! grep -q "the spike is explained by the chain" web-v1-app/src/components/home/InteractiveHomeDashboard.tsx
          ! grep -q "It already says why" web-v1-app/src/components/home/InteractiveHomeDashboard.tsx
      - name: Install and verify web app
        working-directory: web-v1-app
        run: |
          npm ci
          npm run lint
          npm run typecheck
          npm run build -- --webpack
      - name: Commit homepage patch
        run: |
          rm .github/workflows/tmp-home-sales-pitch.yml
          rm scripts/tmp_patch_home_sales_pitch.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add web-v1-app/src/components/home/InteractiveHomeDashboard.tsx .github/workflows/tmp-home-sales-pitch.yml scripts/tmp_patch_home_sales_pitch.py
          git commit -m "feat: clarify network-regime sales pitch"
          git push origin HEAD:docs/home-regime-sales-pitch
