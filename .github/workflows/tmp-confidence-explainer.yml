name: Temporary confidence explainer patch

on:
  push:
    branches:
      - docs/home-confidence-explainer

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: docs/home-confidence-explainer
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Apply patch
        run: python tools/tmp_patch_confidence_explainer.py
      - name: Validate copy
        run: |
          python - <<'PY'
          from pathlib import Path
          s = Path('web-v1-app/src/components/home/InteractiveHomeDashboard.tsx').read_text(encoding='utf-8')
          required = [
            'Confidence is evidence strength — not probability.',
            'A displayed confidence of 74% does not mean there is a 74% chance the regime label is correct.',
            'sqrt(data quality × label confidence)',
            'UNKNOWN/DEGRADED',
            'It is not the probability that the label is correct.',
          ]
          missing = [x for x in required if x not in s]
          if missing:
              raise SystemExit(f'missing expected confidence copy: {missing}')
          PY
      - name: Install and verify web app
        working-directory: web-v1-app
        run: |
          npm ci
          npm run lint
          npm run typecheck
          npm run build -- --webpack
      - name: Commit patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add web-v1-app/src/components/home/InteractiveHomeDashboard.tsx
          git commit -m "feat: explain confidence on homepage"
          git push origin HEAD:docs/home-confidence-explainer
