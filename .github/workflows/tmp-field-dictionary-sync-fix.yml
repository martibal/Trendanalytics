name: Temporary field dictionary sync fix

on:
  push:
    branches:
      - docs/field-dictionary-v2

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: docs/field-dictionary-v2
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Apply sync fix
        run: python tools/tmp_fix_field_dictionary_sync.py
      - name: Install dependencies
        working-directory: web-v1-app
        run: npm ci
      - name: Validate field dictionary sync
        working-directory: web-v1-app
        run: npm run check:field-dictionary-sync
      - name: Verify web app
        working-directory: web-v1-app
        run: |
          npm run lint
          npm run typecheck
          npm run build -- --webpack
      - name: Commit patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add web-v1-app/src/app/methodology/fields/page.tsx
          git commit -m "docs: separate canonical and extension fields"
          git push origin HEAD:docs/field-dictionary-v2
