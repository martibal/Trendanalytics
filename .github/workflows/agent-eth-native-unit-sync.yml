name: Agent Ethereum native-unit correctness migration

on:
  push:
    branches:
      - agent/ethereum-native-unit-normalization

permissions:
  contents: write

jobs:
  sync:
    if: "!contains(github.event.head_commit.message, '[eth-native-unit-sync]')"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/ethereum-native-unit-normalization
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: web-v1-app/package-lock.json

      - name: Install Python dependencies
        run: pip install -r pipeline/requirements.txt

      - name: Install web dependencies
        working-directory: web-v1-app
        run: npm ci

      - name: Apply correctness migration
        run: python .agent/eth_native_unit_sync.py

      - name: Verify targeted gates
        run: |
          python -m py_compile pipeline/src/feature_daily_agg.py pipeline/src/build_gold_timeseries.py
          cd web-v1-app
          npm run check:pipeline-golden-fixture
          npm run check:field-dictionary-sync
          npm run check:calculation-correctness

      - name: Commit product changes
        run: |
          rm .agent/eth_native_unit_sync.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add pipeline/src/feature_daily_agg.py pipeline/tools/full_pipeline.ps1 pipeline/methodology-version.json web-v1-app/scripts/pipeline-golden-fixture.mjs web-v1-app/src/app/methodology/fields/page.tsx .agent/eth_native_unit_sync.py
          git commit -m "Normalize Ethereum native units and rebuild semantics [eth-native-unit-sync]"
          git push origin HEAD:agent/ethereum-native-unit-normalization
