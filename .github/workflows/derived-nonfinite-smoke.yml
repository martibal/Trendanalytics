name: Derived Nonfinite Lineage Smoke

on:
  push:
    branches:
      - fix/derived-nonfinite-lineage
    paths:
      - ".github/workflows/derived-nonfinite-smoke.yml"
      - "pipeline/tools/export_derived_json_history.py"
      - "pipeline/tools/test_derived_nonfinite_lineage.py"

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install pandas
        run: pip install "pandas>=2.2,<2.3"
      - name: Run non-finite lineage regression
        run: python pipeline/tools/test_derived_nonfinite_lineage.py
