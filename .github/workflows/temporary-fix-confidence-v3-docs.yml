name: Temporary fix Confidence v3 docs

on:
  push:
    branches:
      - docs/validation-methodology-v1

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: docs/validation-methodology-v1
      - name: Apply final wording corrections
        run: python scripts/fix_remaining_confidence_v3_docs.py
      - name: Commit wording corrections
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add web-v1-app/src/app/methodology/page.tsx web-v1-app/src/app/methodology/reference/page.tsx
          git commit -m "docs: finish Confidence v3 wording alignment"
          git push origin HEAD:docs/validation-methodology-v1
