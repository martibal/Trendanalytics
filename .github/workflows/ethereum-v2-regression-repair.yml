name: Ethereum v2 Regression Repair

on:
  push:
    branches:
      - fix/incremental-meta-staging-seed
    paths:
      - "pipeline/tools/export_meta_json_history.py"
      - "pipeline/tools/validate_meta_methodology_safety.py"
      - ".github/workflows/ethereum-v2-regression-repair.yml"

permissions:
  contents: write

jobs:
  repair:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: fix/incremental-meta-staging-seed

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r pipeline/requirements.txt

      - name: Verify incremental META staging seed semantics
        run: |
          python - <<'PY'
          import json
          import tempfile
          from pathlib import Path

          from pipeline.tools.export_meta_json_history import _seed_incremental_chain_from_published

          with tempfile.TemporaryDirectory() as tmp:
              root = Path(tmp)
              canonical = root / 'data/published/v1/meta/ethereum'
              staging = root / 'data/calculated/meta/ethereum'
              canonical.mkdir(parents=True)
              staging.mkdir(parents=True)

              canonical_day = {'date': '2025-09-01', 'regime': {'ruleset_id': 'eth_l1_v2', 'label': 'HEATING'}}
              stale_day = {'date': '2025-09-01', 'regime': {'ruleset_id': 'eth_l1_v1', 'label': 'STABLE'}}
              orphan_day = {'date': '2024-12-01', 'regime': {'ruleset_id': 'eth_l1_v1', 'label': 'STABLE'}}

              (canonical / '2025-09-01.json').write_text(json.dumps(canonical_day), encoding='utf-8')
              (canonical / 'latest.json').write_text(json.dumps(canonical_day), encoding='utf-8')
              (staging / '2025-09-01.json').write_text(json.dumps(stale_day), encoding='utf-8')
              (staging / '2024-12-01.json').write_text(json.dumps(orphan_day), encoding='utf-8')
              (staging / 'latest.json').write_text(json.dumps(stale_day), encoding='utf-8')

              copied = _seed_incremental_chain_from_published(root, root / 'data/calculated/meta', 'ethereum')
              if copied != 2:
                  raise SystemExit(f'expected 2 canonical snapshot files copied, got {copied}')
              seeded = json.loads((staging / '2025-09-01.json').read_text(encoding='utf-8'))
              if (seeded.get('regime') or {}).get('ruleset_id') != 'eth_l1_v2':
                  raise SystemExit('stale staging was not replaced by canonical v2 data')
              if (staging / '2024-12-01.json').exists():
                  raise SystemExit('stale orphan day survived incremental staging seed')
              latest = json.loads((staging / 'latest.json').read_text(encoding='utf-8'))
              if latest != canonical_day:
                  raise SystemExit('latest.json was not seeded from canonical data')

          print('[META_INCREMENTAL_SEED_TEST] OK')
          PY

      - name: Surgically restore Ethereum v2 history
        run: |
          python - <<'PY'
          import copy
          import hashlib
          import json
          import shutil
          from collections import Counter
          from pathlib import Path

          import pandas as pd

          from api.main import CONFIDENCE_THRESHOLD, _status_from_regime_and_scorecard, get_chain_profile
          from api.regime_engine import compute_regime, reconcile_regime_with_scorecard

          gold_dir = Path('data/published/v1/gold/ethereum')
          canonical = Path('data/published/v1/meta/ethereum')
          private = Path('web-v1-app/.private-data/published/v1/meta/ethereum')
          gold_files = sorted(gold_dir.glob('????-??-??.json'))
          meta_files = sorted(canonical.glob('????-??-??.json'))
          if len(gold_files) != 617 or len(meta_files) != 617:
              raise SystemExit(f'expected 617 ETH gold/meta days, got gold={len(gold_files)} meta={len(meta_files)}')

          rows = [json.loads(p.read_text(encoding='utf-8')) for p in gold_files]
          df = pd.DataFrame(rows)
          df['date'] = pd.to_datetime(df['date'], errors='coerce')
          df = df.dropna(subset=['date']).sort_values('date').reset_index(drop=True)
          if len(df) != 617 or int(df['nonempty_calldata_share'].notna().sum()) != 617:
              raise SystemExit('Ethereum Gold coverage/calldata precondition failed')

          profile = get_chain_profile('ethereum')
          original = {}
          changes = []
          rulesets = Counter()
          methodologies = Counter()

          for p in meta_files:
              old = json.loads(p.read_text(encoding='utf-8'))
              original[p.name] = copy.deepcopy(old)
              asof = p.stem
              slice_df = df[df['date'] <= pd.Timestamp(asof)].copy()

              confidence = old.get('confidence') or {}
              effective_confidence = confidence.get('confidence_score')
              if effective_confidence is None:
                  effective_confidence = (old.get('publish_confidence') or {}).get('confidence_score')

              scorecard = old.get('scorecard') or {}
              regime = compute_regime(
                  slice_df,
                  chain='ethereum',
                  profile=profile,
                  asof_date=asof,
                  window_days=7,
                  confidence_score=effective_confidence,
                  confidence_threshold=CONFIDENCE_THRESHOLD,
              )
              regime = reconcile_regime_with_scorecard(regime, scorecard)

              if str(regime.get('label') or '').upper() == 'UNKNOWN/DEGRADED':
                  old_candidate = (old.get('regime') or {}).get('candidate_label')
                  if old_candidate is not None:
                      regime['candidate_label'] = old_candidate

              old_label = str((old.get('regime') or {}).get('label'))
              new_label = str(regime.get('label'))
              if old_label != new_label:
                  changes.append({'date': asof, 'old': old_label, 'new': new_label})

              new_obj = copy.deepcopy(old)
              new_obj['methodology_version'] = '1.1'
              new_obj['regime'] = regime
              new_obj['status'] = _status_from_regime_and_scorecard(regime, scorecard)
              p.write_text(json.dumps(new_obj, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')

              rulesets[str(regime.get('ruleset_id'))] += 1
              methodologies[str(new_obj.get('methodology_version'))] += 1

          allowed_dates = {'2025-09-01', '2026-03-05'}
          if len(changes) > 2:
              raise SystemExit(f'too many surgical label changes: {changes}')
          for change in changes:
              if change['date'] not in allowed_dates:
                  raise SystemExit(f'unexpected surgical changed date: {change}')
              if change['old'] != 'STABLE' or change['new'] != 'HEATING':
                  raise SystemExit(f'unexpected surgical transition: {change}')
          if rulesets != Counter({'eth_l1_v2': 617}):
              raise SystemExit(f'unexpected rulesets: {rulesets}')
          if methodologies != Counter({'1.1': 617}):
              raise SystemExit(f'unexpected top-level methodology versions: {methodologies}')

          for p in meta_files:
              new = json.loads(p.read_text(encoding='utf-8'))
              old = original[p.name]
              for key in ('confidence', 'data_confidence', 'publish_confidence', 'scorecard'):
                  if new.get(key) != old.get(key):
                      raise SystemExit(f'{key} drift: {p.name}')

          day_paths = sorted(canonical.glob('????-??-??.json'))
          latest_obj = json.loads(day_paths[-1].read_text(encoding='utf-8'))
          (canonical / 'latest.json').write_text(json.dumps(latest_obj, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')
          for n in (7, 30, 90, 180, 365):
              payload = [json.loads(p.read_text(encoding='utf-8')) for p in day_paths[-n:]]
              (canonical / f'last{n}d.json').write_text(json.dumps(payload, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')

          manifest_path = canonical / 'manifest.json'
          manifest = json.loads(manifest_path.read_text(encoding='utf-8'))
          manifest['methodology_version'] = 'v1'
          manifest_path.write_text(json.dumps(manifest, ensure_ascii=False, indent=2, sort_keys=True) + '\n', encoding='utf-8')

          if private.exists():
              shutil.rmtree(private)
          shutil.copytree(canonical, private)

          cfiles = sorted(p.relative_to(canonical) for p in canonical.rglob('*') if p.is_file())
          pfiles = sorted(p.relative_to(private) for p in private.rglob('*') if p.is_file())
          if cfiles != pfiles:
              raise SystemExit('canonical/private META file lists differ')
          for rel in cfiles:
              a = hashlib.sha256((canonical / rel).read_bytes()).hexdigest()
              b = hashlib.sha256((private / rel).read_bytes()).hexdigest()
              if a != b:
                  raise SystemExit(f'canonical/private mismatch: {rel}')

          print('changes=', changes)
          print('rulesets=', dict(rulesets))
          print('methodologies=', dict(methodologies))
          PY

      - name: Validate repaired canonical history
        run: |
          python pipeline/tools/validate_meta_methodology_safety.py --root . --meta-root data/published/v1/meta

      - name: Verify repair scope and commit data
        run: |
          python - <<'PY'
          import subprocess

          lines = subprocess.check_output(['git', 'status', '--porcelain'], text=True).splitlines()
          paths = [line[3:] for line in lines if len(line) >= 4]
          allowed_prefixes = (
              'data/published/v1/meta/ethereum/',
              'web-v1-app/.private-data/published/v1/meta/ethereum/',
          )
          unexpected = [p for p in paths if not p.startswith(allowed_prefixes)]
          if unexpected:
              raise SystemExit(f'unexpected changed paths: {unexpected[:20]}')
          substantive = [p for p in paths if p.startswith(allowed_prefixes)]
          if not substantive:
              raise SystemExit('repair produced no changed Ethereum META files')
          print(f'[REPAIR_SCOPE] changed_files={len(substantive)}')
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/published/v1/meta/ethereum web-v1-app/.private-data/published/v1/meta/ethereum
          git commit -m "data: restore Ethereum v2 META history [skip ci]"
          git push origin HEAD:fix/incremental-meta-staging-seed
