name: Agent Ethereum gas p90 sync

on:
  push:
    branches:
      - agent/ethereum-block-gas-p90

permissions:
  contents: write

jobs:
  sync:
    if: "!contains(github.event.head_commit.message, '[eth-gas-p90-sync]')"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/ethereum-block-gas-p90
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: web-v1-app/package-lock.json

      - name: Install Python dependencies
        run: pip install -r pipeline/requirements.txt

      - name: Install web dependencies
        working-directory: web-v1-app
        run: npm ci

      - name: Align sync-script fixture expectation
        shell: python
        run: |
          from pathlib import Path
          p = Path('.agent/eth_gas_p90_sync.py')
          text = p.read_text(encoding='utf-8')
          anchor = 'fixture = "web-v1-app/scripts/pipeline-golden-fixture.mjs"\n'
          addition = '''replace_once(\n    "web-v1-app/scripts/pipeline-golden-fixture.mjs",\n    '    applied: ["gas_utilization_pct_null_for_btc"],',\n    '    applied: ["gas_utilization_pct_null_for_btc", "block_gas_utilization_p90_null_for_non_eth"],',\n)\n\n'''
          if anchor not in text:
              raise SystemExit('Could not find fixture anchor in sync script')
          p.write_text(text.replace(anchor, addition + anchor, 1), encoding='utf-8')

      - name: Apply synchronized product change
        run: python .agent/eth_gas_p90_sync.py

      - name: Verify targeted gates
        run: |
          python -m py_compile pipeline/src/feature_daily_agg.py pipeline/src/build_gold_timeseries.py
          cd web-v1-app
          npm run check:pipeline-golden-fixture
          npm run check:field-dictionary-sync

      - name: Commit product changes
        run: |
          rm .agent/eth_gas_p90_sync.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add pipeline/src/feature_daily_agg.py pipeline/src/build_gold_timeseries.py pipeline/methodology-version.json web-v1-app/scripts/pipeline-golden-fixture.mjs web-v1-app/src/app/methodology/fields/page.tsx .agent/eth_gas_p90_sync.py
          git commit -m "Add Ethereum block gas utilization p90 [eth-gas-p90-sync]"
          git push origin HEAD:agent/ethereum-block-gas-p90
