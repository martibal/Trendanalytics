name: Phase 0 TED Real Outcome Run v7

on:
  push:
    branches:
      - phase0-ted-real-run
  workflow_dispatch:

permissions:
  contents: read

jobs:
  phase0:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Checkout isolated runner branch
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install runtime
        run: pip install requests pandas numpy pyarrow

      - name: Reconstruct independently verified v6 base
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p phase0_real_run/frozen_v6 phase0_real_run/frozen_v7
          cat phase0_real_run/frozen_zip.part1.b64 \
              phase0_real_run/frozen_zip.part2.b64 \
              phase0_real_run/frozen_zip.part3.b64 \
              phase0_real_run/frozen_zip.part4.b64 | base64 -d > /tmp/phase0_v6.zip
          echo "7520b783a14e50d27a6b1b207f25c02d940c7c74929df7202e6fc88d6f350f22  /tmp/phase0_v6.zip" | sha256sum -c -
          unzip -q /tmp/phase0_v6.zip -d phase0_real_run/frozen_v6
          python phase0_real_run/frozen_v6/test_phase0_v6.py

      - name: Materialize and byte-verify frozen v7
        shell: bash
        run: |
          set -euo pipefail
          python phase0_real_run/materialize_v7.py phase0_real_run/frozen_v6 phase0_real_run/frozen_v7
          echo "a719f44fea61abac1963947d0df5b93a0a1de1bcd5f83ef1c7436948a89959fc  phase0_real_run/frozen_v7/nis2_country_registry.json" | sha256sum -c -
          echo "ad2c53421c20871db3b178c920cdfa4fe9f933578f5f36d9b0be0b9df46f89db  phase0_real_run/frozen_v7/cpv_definitions.json" | sha256sum -c -
          echo "279840add437fcf190f44cef53800cf2002f7fb33b7030add9d691604339e623  phase0_real_run/frozen_v7/phase0_preregistration.json" | sha256sum -c -
          echo "2ea685ac7dc5c8bca8a4b546bd42de3467b1a220dc9fb8cf84ac04880b96a387  phase0_real_run/frozen_v7/build_phase0_panel_v7.py" | sha256sum -c -
          echo "666336f57c42dc450b4f1da78dda33e0a2135a823e18eb643ebf3c7159fa581a  phase0_real_run/frozen_v7/regulatory_demand_phase0_v7.py" | sha256sum -c -
          echo "b93ac5db16501082646c86e3dfa6d510aef6ec63044931e63a71f3d62dd1894c  phase0_real_run/fetch_ted_phase0_v7.py" | sha256sum -c -

      - name: Fetch real TED Competition/Contract Notice outcomes
        run: |
          python phase0_real_run/fetch_ted_phase0_v7.py \
            --frozen-dir phase0_real_run/frozen_v7 \
            --out phase0_real_run/ted_normalized_v7.csv \
            --log phase0_real_run/fetch_log_v7.json

      - name: Build frozen v7 monthly panel
        run: |
          python phase0_real_run/frozen_v7/build_phase0_panel_v7.py \
            --source phase0_real_run/ted_normalized_v7.csv \
            --prereg phase0_real_run/frozen_v7/phase0_preregistration.json \
            --country-registry phase0_real_run/frozen_v7/nis2_country_registry.json \
            --cpv-definitions phase0_real_run/frozen_v7/cpv_definitions.json \
            --out-panel phase0_real_run/phase0_panel_v7.csv \
            --out-meta phase0_real_run/phase0_panel_meta_v7.json

      - name: Run frozen v7 hard gate
        id: gate
        shell: bash
        run: |
          set +e
          python phase0_real_run/frozen_v7/regulatory_demand_phase0_v7.py \
            --panel phase0_real_run/phase0_panel_v7.csv \
            --panel-meta phase0_real_run/phase0_panel_meta_v7.json \
            --prereg phase0_real_run/frozen_v7/phase0_preregistration.json \
            --country-registry phase0_real_run/frozen_v7/nis2_country_registry.json \
            --cpv-definitions phase0_real_run/frozen_v7/cpv_definitions.json \
            --out phase0_real_run/phase0_results_v7.json
          RC=$?
          set -e
          echo "$RC" | tee phase0_real_run/gate_exit_code_v7.txt
          if [ "$RC" -ne 0 ] && [ "$RC" -ne 2 ]; then
            echo "Frozen v7 engine failed with unexpected exit code $RC"
            exit "$RC"
          fi

      - name: Print frozen verdict
        if: always()
        run: |
          echo "=== GATE EXIT CODE ==="
          cat phase0_real_run/gate_exit_code_v7.txt 2>/dev/null || true
          echo "=== PHASE 0 V7 RESULTS ==="
          python -m json.tool phase0_real_run/phase0_results_v7.json 2>/dev/null || true
          echo "=== FETCH SUMMARY ==="
          python - <<'PY'
          import json, pathlib
          p=pathlib.Path('phase0_real_run/fetch_log_v7.json')
          if p.exists():
              d=json.loads(p.read_text())
              print(json.dumps({k:v for k,v in d.items() if k!='audit'},indent=2))
          PY

      - name: Compress audit source
        if: always()
        run: gzip -9 -f phase0_real_run/ted_normalized_v7.csv 2>/dev/null || true

      - name: Upload complete Phase 0 v7 result
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: phase0-ted-real-result-v7
          if-no-files-found: warn
          retention-days: 30
          path: |
            phase0_real_run/phase0_results_v7.json
            phase0_real_run/gate_exit_code_v7.txt
            phase0_real_run/phase0_panel_v7.csv
            phase0_real_run/phase0_panel_meta_v7.json
            phase0_real_run/fetch_log_v7.json
            phase0_real_run/ted_normalized_v7.csv.gz
