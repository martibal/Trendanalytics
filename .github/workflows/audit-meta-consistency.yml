name: Audit Published Meta Consistency

on:
  push:
    branches:
      - audit/internal-consistency-20260812
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Run consistency audit
        run: python scripts/audit_published_meta_consistency.py
      - name: Run churn breakdown
        run: python scripts/audit_meta_churn_breakdown.py
      - name: Upload audit reports
        uses: actions/upload-artifact@v4
        with:
          name: meta-consistency-audit
          path: |
            audit-meta-consistency.json
            audit-meta-churn.json
          retention-days: 7
