name: Ethereum Basefee Friction Consensus Audit

on:
  workflow_dispatch:
  push:
    branches:
      - agent/ethereum-basefee-friction-consensus-audit
    paths:
      - .github/workflows/ethereum-basefee-friction-consensus-audit.yml

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install pandas numpy

      - name: Run basefee friction consensus audit
        shell: bash
        run: |
          python - <<'PY'
          import json
          from collections import Counter
          from pathlib import Path
          import pandas as pd
          import api.regime_engine as engine

          gold_root = Path('data/published/v1/gold/ethereum')
          meta_root = Path('data/published/v1/meta/ethereum')
          gold_paths = sorted(gold_root.glob('????-??-??.json'))
          meta_paths = sorted(meta_root.glob('????-??-??.json'))
          if len(gold_paths) != 617 or len(meta_paths) != 617:
              raise SystemExit(f'expected 617 Ethereum Gold/META days, got gold={len(gold_paths)} meta={len(meta_paths)}')

          rows = []
          for p in gold_paths:
              obj = json.loads(p.read_text(encoding='utf-8'))
              obj.setdefault('date', p.stem)
              rows.append(obj)
          df = pd.DataFrame(rows)
          df['date'] = pd.to_datetime(df['date'], errors='coerce')
          df = df.dropna(subset=['date']).sort_values('date').reset_index(drop=True)
          if len(df) != 617:
              raise SystemExit(f'expected 617 parsed Gold rows, got {len(df)}')

          rulesets = Counter()
          changes = []
          qualifying_days = 0
          basefee_high_capacity_high_days = 0

          for i in range(len(df)):
              day = df.loc[i, 'date'].date().isoformat()
              sub = df.iloc[:i+1].copy()
              meta = json.loads((meta_root / f'{day}.json').read_text(encoding='utf-8'))
              regime = meta.get('regime') or {}
              published = regime.get('label')
              rulesets[regime.get('ruleset_id')] += 1
              confidence = (meta.get('confidence') or {}).get('confidence_score')

              evidence = engine.compute_regime(
                  sub,
                  chain='ethereum',
                  profile={'type': 'eth_l1'},
                  asof_date=day,
                  confidence_score=confidence,
              )
              capacity = (evidence.get('axes') or {}).get('capacity') or {}
              capacity_high = (
                  str(capacity.get('band_high', 'NORMAL')) in ('HIGH', 'EXTREME_HIGH')
                  and int(capacity.get('informative_count', 0) or 0) > 0
              )

              basefee = engine._signal_for_metric(sub, 'median_block_base_fee_per_gas') or {}
              informative = bool(basefee.get('informative', False))
              pct = float(basefee.get('pct_90d', 50.0))
              z = float(basefee.get('z_robust', 0.0))
              consensus_high = informative and pct >= 80.0 and z >= 1.5
              if consensus_high:
                  qualifying_days += 1
              if consensus_high and capacity_high:
                  basefee_high_capacity_high_days += 1

              guarded = published
              reason = None
              if published == 'CHEAP' and consensus_high:
                  guarded = 'STABLE'
                  reason = 'basefee_high_vetoes_cheap'
              elif published == 'STABLE' and consensus_high and capacity_high:
                  guarded = 'CONGESTED'
                  reason = 'basefee_high_plus_existing_capacity_high'

              if guarded != published:
                  changes.append({
                      'date': day,
                      'from': published,
                      'to': guarded,
                      'reason': reason,
                      'pct_90d': pct,
                      'z_robust': z,
                      'capacity_high': capacity_high,
                  })

          if rulesets != Counter({'eth_l1_v2': 617}):
              raise SystemExit(f'unexpected rulesets: {dict(rulesets)}')

          report = {
              'scope': {
                  'start': df.iloc[0]['date'].date().isoformat(),
                  'end': df.iloc[-1]['date'].date().isoformat(),
                  'days': len(df),
              },
              'baseline': 'published META regime.label',
              'rulesets': dict(rulesets),
              'candidate_metric': 'median_block_base_fee_per_gas',
              'qualifier': 'informative AND pct_90d>=80 AND z_robust>=1.5',
              'semantics': {
                  'cheap_veto': 'published CHEAP + basefee consensus HIGH -> STABLE',
                  'congestion_corroboration': 'published STABLE + basefee consensus HIGH + existing core Capacity HIGH -> CONGESTED',
                  'heating_creation': False,
                  'existing_congested_rewrite': False,
              },
              'qualifying_days': qualifying_days,
              'basefee_high_capacity_high_days': basefee_high_capacity_high_days,
              'change_count': len(changes),
              'transition_counts': dict(Counter(f"{r['from']}->{r['to']}" for r in changes)),
              'reason_counts': dict(Counter(r['reason'] for r in changes)),
              'changes': changes,
              'guardrails': [
                  'Observational only; no production files modified.',
                  'Published labels remain baseline.',
                  'Basefee is separate Friction evidence; core ETH v2 axes remain unchanged.',
                  'Only CHEAP->STABLE and STABLE->CONGESTED are evaluated.',
              ],
          }

          Path('ethereum-basefee-friction-consensus-audit.json').write_text(
              json.dumps(report, indent=2, sort_keys=True) + '\n',
              encoding='utf-8',
          )
          print(json.dumps(report, indent=2, sort_keys=True))
          PY

      - name: Upload audit report
        uses: actions/upload-artifact@v4
        with:
          name: ethereum-basefee-friction-consensus-audit
          path: ethereum-basefee-friction-consensus-audit.json
          if-no-files-found: error
          retention-days: 7
