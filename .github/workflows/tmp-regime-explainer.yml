name: Temporary regime explainer patch

on:
  push:
    branches:
      - docs/home-regime-explainer

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: docs/home-regime-explainer
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Apply patch
        run: python tools/tmp_patch_regime_explainer.py
      - name: Validate copy
        run: |
          python - <<'PY'
          from pathlib import Path
          s = Path('web-v1-app/src/components/home/InteractiveHomeDashboard.tsx').read_text(encoding='utf-8')
          required = [
            'Four labels. One question: what kind of network day was it?',
            'No unusual network condition dominates the evidence.',
            'Network activity is unusually elevated and still strengthening.',
            'The network is under material usage or capacity pressure.',
            'Using the network is unusually inexpensive without contradictory capacity pressure.',
            'Each label is relative to that chain&apos;s own recent history.',
          ]
          missing = [x for x in required if x not in s]
          if missing:
              raise SystemExit(f'missing expected copy: {missing}')
          PY
      - name: Install and verify web app
        working-directory: web-v1-app
        run: |
          npm ci
          npm run lint
          npm run typecheck
          npm run build -- --webpack
      - name: Commit patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add web-v1-app/src/components/home/InteractiveHomeDashboard.tsx
          git commit -m "feat: explain network regimes on homepage"
          git push origin HEAD:docs/home-regime-explainer
