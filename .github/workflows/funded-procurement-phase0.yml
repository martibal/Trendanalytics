name: Funded Procurement Phase 0

on:
  push:
    branches: [phase0-funded-procurement-test]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install pandas openpyxl requests numpy
      - name: Run corrected one-shot data/mechanism test
        shell: bash
        run: |
          set +e
          python phase0_funded_procurement_test.py
          rc=$?
          set -e
          echo "$rc" > /tmp/funded_procurement_exit.txt
          if [ "$rc" -ne 0 ] && [ "$rc" -ne 2 ]; then exit "$rc"; fi
      - name: Upload audit result
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: funded-procurement-phase0-result-v2
          retention-days: 30
          if-no-files-found: warn
          path: |
            /tmp/funded_procurement_result.json
            /tmp/funded_procurement_exit.txt
