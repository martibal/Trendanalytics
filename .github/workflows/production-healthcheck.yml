name: Production Healthcheck

on:
  workflow_dispatch:
    inputs:
      simulate_failure:
        description: "Set to true to verify the failure issue alert path."
        required: false
        default: "false"
        type: choice
        options:
          - "false"
          - "true"
  workflow_run:
    workflows:
      - Daily Pipeline Publish
    types:
      - completed

concurrency:
  group: production-healthcheck
  cancel-in-progress: false

jobs:
  healthcheck:
    if: >
      (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main') ||
      (github.event_name == 'workflow_run' &&
       github.event.workflow_run.head_branch == 'main' &&
       github.event.workflow_run.conclusion == 'success')
    runs-on: ubuntu-latest
    timeout-minutes: 15

    permissions:
      contents: read
      issues: write

    defaults:
      run:
        working-directory: ./web-v1-app

    env:
      URD_HEALTHCHECK_BASE_URL: https://www.urdatlas.com
      URD_HEALTHCHECK_TIMEOUT_MS: "15000"
      URD_HEALTHCHECK_DEPLOY_WAIT_SECONDS: "180"
      URD_HEALTHCHECK_PRO_API_KEY: ${{ secrets.URD_HEALTHCHECK_PRO_API_KEY }}
      URD_HEALTHCHECK_BASIC_API_KEY: ${{ secrets.URD_HEALTHCHECK_BASIC_API_KEY }}
      URD_HEALTHCHECK_BASIC_CHAIN: ${{ secrets.URD_HEALTHCHECK_BASIC_CHAIN }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || github.sha }}

      - name: Wait for production deploy propagation
        if: github.event_name == 'workflow_run'
        run: |
          echo "${{ github.event.workflow_run.name }} completed successfully on main."
          echo "Waiting ${URD_HEALTHCHECK_DEPLOY_WAIT_SECONDS}s before checking production so the Vercel deploy hook can propagate."
          sleep "${URD_HEALTHCHECK_DEPLOY_WAIT_SECONDS}"

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: web-v1-app/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run production healthcheck
        run: npm run check:production-health

      - name: Verify subscriber history contract
        run: node scripts/production-subscriber-history-check.mjs

      - name: Simulate failure issue alert
        if: github.event_name == 'workflow_dispatch' && inputs.simulate_failure == 'true'
        run: |
          echo "Manual failure simulation requested. This is expected to fail so the issue alert path can be verified."
          exit 1

      - name: Open or update production healthcheck failure issue
        if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const title = "[Production Healthcheck] Failure";
            const runUrl = `${context.serverUrl}/${owner}/${repo}/actions/runs/${context.runId}`;
            const shortSha = context.sha.slice(0, 12);
            const now = new Date().toISOString();
            const simulated = context.eventName === "workflow_dispatch" && String(context.payload.inputs?.simulate_failure || "false") === "true";
            const trigger = context.eventName === "workflow_run" ? `${context.payload.workflow_run?.name || "Upstream workflow"} completed successfully` : "Manual workflow dispatch";
            const body = [
              simulated ? "Manual failure simulation was requested to verify the production healthcheck alert path." : "The post-deploy production healthcheck failed.",
              "",
              `- UTC: ${now}`,
              `- Workflow: ${context.workflow}`,
              `- Trigger: ${trigger}`,
              `- Run: ${runUrl}`,
              `- Ref: ${context.ref}`,
              `- Commit: ${shortSha}`,
              `- Actor: ${context.actor}`,
              `- Simulated: ${simulated ? "yes" : "no"}`,
              "",
              "Start with: `docs/runbooks/production-alerts-and-observability.md`",
              "",
              "If the failure is route/status/data related, use: `docs/runbooks/data-stale-or-missing.md`",
              "",
              "Do not paste secrets, full API keys, Stripe secrets, database URLs, or webhook secrets into this issue.",
            ].join("\n");
            const existingIssues = await github.rest.issues.listForRepo({ owner, repo, state: "open", per_page: 100 });
            const existing = existingIssues.data.find((issue) => !issue.pull_request && issue.title === title);
            if (existing) {
              await github.rest.issues.createComment({ owner, repo, issue_number: existing.number, body });
              core.notice(`Updated existing production healthcheck issue #${existing.number}`);
            } else {
              const created = await github.rest.issues.create({ owner, repo, title, body });
              core.notice(`Created production healthcheck issue #${created.data.number}`);
            }
