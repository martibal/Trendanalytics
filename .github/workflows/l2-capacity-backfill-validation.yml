name: L2 Capacity Backfill Validation

on:
  push:
    branches:
      - agent/l2-capacity-backfill-validation
    paths:
      - ".github/workflows/l2-capacity-backfill-validation.yml"
      - "pipeline/tools/l2_capacity_backfill_chunk.py"
      - "pipeline/tools/l2_capacity_combine_chunks.py"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  plan:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.matrix.outputs.matrix }}
    steps:
      - id: matrix
        name: Build 14-day chunk matrix
        shell: bash
        run: |
          python - <<'PY'
          import json
          import os
          from datetime import date, timedelta

          start = date(2024, 12, 1)
          end = date(2026, 8, 2)
          chunk_days = 14
          include = []
          for chain in ("arbitrum", "base"):
              current = start
              while current <= end:
                  chunk_end = min(current + timedelta(days=chunk_days - 1), end)
                  include.append({
                      "chain": chain,
                      "start": current.isoformat(),
                      "end": chunk_end.isoformat(),
                  })
                  current = chunk_end + timedelta(days=1)
          matrix = json.dumps({"include": include}, separators=(",", ":"))
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as fh:
              fh.write(f"matrix={matrix}\n")
          print(f"planned_chunks={len(include)}")
          PY

  backfill:
    needs: plan
    strategy:
      fail-fast: false
      max-parallel: 8
      matrix: ${{ fromJson(needs.plan.outputs.matrix) }}
    runs-on: ubuntu-latest
    timeout-minutes: 7

    steps:
      - name: Checkout validation branch
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install minimal backfill dependencies
        run: pip install "pyarrow>=18,<19"

      - name: Read bounded historical chunk
        run: |
          python ./pipeline/tools/l2_capacity_backfill_chunk.py \
            --chain ${{ matrix.chain }} \
            --start ${{ matrix.start }} \
            --end ${{ matrix.end }} \
            --max-days 14 \
            --max-day-seconds 60 \
            --output ./reports/chunks/${{ matrix.chain }}-${{ matrix.start }}-${{ matrix.end }}.json

      - name: Upload chunk
        uses: actions/upload-artifact@v4
        with:
          name: l2-capacity-chunk-${{ matrix.chain }}-${{ matrix.start }}-${{ matrix.end }}
          path: reports/chunks/${{ matrix.chain }}-${{ matrix.start }}-${{ matrix.end }}.json
          if-no-files-found: error
          retention-days: 7

  combine:
    needs: backfill
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout validation branch
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install combine dependency
        run: pip install "polars>=1,<2"

      - name: Download all chunk artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: l2-capacity-chunk-*
          path: reports/chunks
          merge-multiple: true

      - name: Combine and validate complete history
        run: |
          python ./pipeline/tools/l2_capacity_combine_chunks.py \
            --chunks-root ./reports/chunks \
            --start 2024-12-01 \
            --end 2026-08-02 \
            --output ./reports/l2-capacity-backfill-combined.json

      - name: Upload validated combined history
        uses: actions/upload-artifact@v4
        with:
          name: l2-capacity-backfill-combined
          path: reports/l2-capacity-backfill-combined.json
          if-no-files-found: error
          retention-days: 7
