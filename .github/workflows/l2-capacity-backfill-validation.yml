name: L2 Capacity Backfill Validation

on:
  push:
    branches:
      - agent/l2-capacity-backfill-validation
    paths:
      - ".github/workflows/l2-capacity-backfill-validation.yml"
      - "pipeline/tools/l2_capacity_s3_preflight.py"
  workflow_dispatch:

jobs:
  preflight:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    permissions:
      contents: read

    steps:
      - name: Checkout validation branch
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install minimal preflight dependencies
        run: |
          python -m pip install --upgrade pip
          pip install "pyarrow>=18,<19"

      - name: Run real-source capacity preflight
        run: |
          python ./pipeline/tools/l2_capacity_s3_preflight.py \
            --dates 2024-12-15,2025-06-15,2026-01-15,2026-08-02 \
            --chains arbitrum,base \
            --history-days 615 \
            --max-sample-seconds 180 \
            --max-projected-serial-minutes 120 \
            --output ./reports/l2-capacity-s3-preflight.json

      - name: Upload preflight report
        uses: actions/upload-artifact@v4
        with:
          name: l2-capacity-s3-preflight
          path: reports/l2-capacity-s3-preflight.json
          if-no-files-found: error
          retention-days: 7
