name: BTC Capacity Methodology Apply

on:
  push:
    branches:
      - agent/btc-capacity-methodology-final
    paths:
      - .github/workflows/btc-capacity-methodology-apply.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: agent/btc-capacity-methodology-final

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web-v1-app/package-lock.json

      - name: Apply bounded BTC methodology changes
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          def replace_once(path, old, new):
              p = Path(path)
              s = p.read_text(encoding='utf-8')
              n = s.count(old)
              if n != 1:
                  raise SystemExit(f'{path}: expected exactly one match, found {n}')
              p.write_text(s.replace(old, new, 1), encoding='utf-8')

          replace_once(
              'api/regime_engine.py',
              '''    "btc": ProfileSpec(\n        profile_type="btc",\n        ruleset_id="btc_v1",\n        demand_metrics=("tx_count_daily", "unique_active_addresses"),\n        friction_metrics=("median_tx_fee_native",),\n        capacity_metrics=(),\n    ),''',
              '''    "btc": ProfileSpec(\n        profile_type="btc",\n        ruleset_id="btc_v2",\n        demand_metrics=("tx_count_daily", "unique_active_addresses"),\n        friction_metrics=("median_tx_fee_native",),\n        capacity_metrics=("block_weight_utilization_pct",),\n    ),'''
          )

          replace_once(
              'api/regime_engine.py',
              '''        "blocktime_instability": "blocktime_instability",\n        "fee_burden_proxy": "median_tx_fee_native",''',
              '''        "blocktime_instability": "blocktime_instability",\n        "block_weight_utilization": "block_weight_utilization_pct",\n        "fee_burden_proxy": "median_tx_fee_native",'''
          )

          replace_once(
              'api/regime_engine.py',
              '''    label = "STABLE"\n    if (friction_high and capacity_high) or (capacity_extreme and ax_c["trend"] == "HEATING"):\n        label = "CONGESTED"\n    elif friction_low and (capacity_low or not capacity_high):\n        label = "CHEAP"\n    elif demand_high and ax_d["trend"] == "HEATING":\n        label = "HEATING"\n    else:\n        label = "STABLE"''',
              '''    label = "STABLE"\n    if spec.profile_type == "btc":\n        # BTC cheap-veto semantics: high blockspace use can veto CHEAP, but\n        # CONGESTED still requires simultaneous Friction and Capacity pressure.\n        if friction_high and capacity_high:\n            label = "CONGESTED"\n        elif friction_low and not capacity_high:\n            label = "CHEAP"\n        elif demand_high and ax_d["trend"] == "HEATING":\n            label = "HEATING"\n        else:\n            label = "STABLE"\n    elif (friction_high and capacity_high) or (capacity_extreme and ax_c["trend"] == "HEATING"):\n        label = "CONGESTED"\n    elif friction_low and (capacity_low or not capacity_high):\n        label = "CHEAP"\n    elif demand_high and ax_d["trend"] == "HEATING":\n        label = "HEATING"\n    else:\n        label = "STABLE"'''
          )

          replace_once(
              'api/market_scorecard.py',
              '''        # BTC has no EVM capacity utilisation semantics in this product layer.\n        # Block-time instability remains visible as a component only when present,\n        # but is not required for a friction/cheap label to be explainable.\n        "capacity": [\n            ("blocktime_instability", 0.7, "instability"),\n        ],''',
              '''        # BTC capacity combines direct blockspace occupancy with block-time\n        # instability. High block weight is descriptive capacity pressure and can\n        # veto CHEAP, while CONGESTED still requires simultaneous Friction pressure.\n        "capacity": [\n            ("block_weight_utilization_pct", 1.0, "none"),\n            ("blocktime_instability", 0.7, "instability"),\n        ],'''
          )

          replace_once(
              'pipeline/methodology-version.json',
              '"methodology_version": "2.1"',
              '"methodology_version": "2.2"'
          )

          test = Path('pipeline/tools/test_btc_capacity_semantics.py')
          test.write_text('''#!/usr/bin/env python3\nimport json\nimport numpy as np\nimport pandas as pd\n\nfrom api.regime_engine import compute_regime\n\n\ndef frame(*, fee_last: float, weight_last: float) -> pd.DataFrame:\n    n = 90\n    x = np.arange(n, dtype=float)\n    tx = np.r_[600000.0 + 1000.0 * np.sin(x[:60] / 6.0), np.full(30, 600000.0)]\n    active = np.r_[500000.0 + 800.0 * np.cos(x[:60] / 7.0), np.full(30, 500000.0)]\n    return pd.DataFrame({\n        "date": pd.date_range("2026-05-12", periods=n, freq="D"),\n        "tx_count_daily": tx,\n        "unique_active_addresses": active,\n        "median_tx_fee_native": np.r_[2.0e-6 + 2.0e-7 * np.sin(x[:-1] / 5.0), fee_last],\n        "block_weight_utilization_pct": np.r_[0.72 + 0.03 * np.sin(x[:-1] / 4.0), weight_last],\n        "avg_block_time_sec": 600.0 + 8.0 * np.sin(x / 9.0),\n    })\n\n\ndef evaluate(name: str, df: pd.DataFrame, expected: str) -> None:\n    out = compute_regime(\n        df,\n        chain="bitcoin",\n        profile={"type": "btc"},\n        asof_date=str(df["date"].iloc[-1].date()),\n        confidence_score=1.0,\n    )\n    assert out["ruleset_id"] == "btc_v2"\n    assert "block_weight_utilization_pct" in out["signals"]\n    diag = {\n        "case": name,\n        "expected": expected,\n        "actual": out["label"],\n        "axes": out["axes"],\n        "fee": out["signals"].get("median_tx_fee_native"),\n        "block_weight": out["signals"].get("block_weight_utilization_pct"),\n        "blocktime_instability": out["signals"].get("blocktime_instability"),\n        "drivers": out["drivers"],\n    }\n    print("[BTC_CAPACITY_DIAG] " + json.dumps(diag, sort_keys=True), flush=True)\n    assert out["label"] == expected, f'{name}: expected {expected}, got {out["label"]}'\n\n\nevaluate("low_fee_high_weight", frame(fee_last=1.0e-8, weight_last=0.999), "STABLE")\nevaluate("high_fee_high_weight", frame(fee_last=2.0e-5, weight_last=0.999), "CONGESTED")\nevaluate("low_fee_normal_weight", frame(fee_last=1.0e-8, weight_last=0.72), "CHEAP")\n\nprint("[BTC_CAPACITY] OK: btc_v2 cheap-veto semantics validated")\n''', encoding='utf-8')
          PY

      - name: Run BTC capacity semantics test
        run: |
          python -m pip install --upgrade pip
          pip install pandas numpy polars pyarrow
          PYTHONPATH=. python pipeline/tools/test_btc_capacity_semantics.py

      - name: Run methodology governance gates
        working-directory: web-v1-app
        run: |
          npm ci
          npm run check:pipeline-determinism
          npm run check:pipeline-golden-fixture

      - name: Assert bounded diff scope
        shell: bash
        run: |
          set -euo pipefail
          bad=$(git status --porcelain | awk '{print $2}' | grep -v -E '^(api/regime_engine.py|api/market_scorecard.py|pipeline/methodology-version.json|pipeline/tools/test_btc_capacity_semantics.py|.github/workflows/btc-capacity-methodology-apply.yml)$' || true)
          if [ -n "$bad" ]; then
            echo "Unexpected changed files:"
            echo "$bad"
            exit 1
          fi
          git diff --check

      - name: Commit methodology changes
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add api/regime_engine.py api/market_scorecard.py pipeline/methodology-version.json pipeline/tools/test_btc_capacity_semantics.py
          git commit -m "feat(methodology): add BTC blockspace capacity veto"
          git push origin HEAD:agent/btc-capacity-methodology-final
