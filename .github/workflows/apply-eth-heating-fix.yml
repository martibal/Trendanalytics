name: Apply ETH heating reconciliation fix

on:
  push:
    branches:
      - fix/eth-heating-reconciliation
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    if: github.event.head_commit.message != 'fix: align ETH HEATING reconciliation'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/eth-heating-reconciliation
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Apply targeted change
        run: python scripts/apply_eth_heating_reconciliation_fix.py
      - name: Install test dependencies
        run: python -m pip install pandas numpy
      - name: Run regression tests
        run: python -m unittest discover -s tests -p 'test_*.py'
      - name: Remove temporary patch machinery
        run: git rm scripts/apply_eth_heating_reconciliation_fix.py .github/workflows/apply-eth-heating-fix.yml
      - name: Commit targeted fix
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add api/regime_engine.py tests/test_regime_reconciliation.py .github/workflows/ci.yml
          git commit -m 'fix: align ETH HEATING reconciliation'
          git push origin HEAD:fix/eth-heating-reconciliation
