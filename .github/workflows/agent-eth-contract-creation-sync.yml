name: Agent Ethereum contract creation sync

on:
  push:
    branches:
      - agent/ethereum-contract-creation-share

permissions:
  contents: write

jobs:
  sync:
    if: "!contains(github.event.head_commit.message, '[eth-contract-creation-sync]')"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/ethereum-contract-creation-share
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: web-v1-app/package-lock.json

      - name: Install Python dependencies
        run: pip install -r pipeline/requirements.txt

      - name: Install web dependencies
        working-directory: web-v1-app
        run: npm ci

      - name: Apply synchronized product change
        run: python .agent/eth_contract_creation_sync.py

      - name: Verify targeted gates
        run: |
          python -m py_compile pipeline/src/feature_daily_agg.py pipeline/src/build_gold_timeseries.py
          cd web-v1-app
          npm run check:pipeline-golden-fixture
          npm run check:field-dictionary-sync

      - name: Commit product changes
        run: |
          rm .agent/eth_contract_creation_sync.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add pipeline/src/feature_daily_agg.py pipeline/src/build_gold_timeseries.py pipeline/methodology-version.json web-v1-app/scripts/pipeline-golden-fixture.mjs web-v1-app/src/app/methodology/fields/page.tsx .agent/eth_contract_creation_sync.py
          git commit -m "Add Ethereum contract creation share [eth-contract-creation-sync]"
          git push origin HEAD:agent/ethereum-contract-creation-share
