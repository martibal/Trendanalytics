name: L2 Confidence Capacity Patch

on:
  push:
    branches:
      - fix/l2-confidence-capacity-required

permissions:
  contents: write

jobs:
  patch-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r pipeline/requirements.txt

      - name: Apply exact confidence methodology patch
        run: |
          python - <<'PY'
          from pathlib import Path
          import json

          p = Path("api/confidence_engine.py")
          text = p.read_text(encoding="utf-8")

          old_version = 'CONFIDENCE_METHODOLOGY_VERSION = "confidence_v2_profile_evidence"'
          new_version = 'CONFIDENCE_METHODOLOGY_VERSION = "confidence_v3_l2_capacity_required"'
          if old_version in text:
              text = text.replace(old_version, new_version, 1)
          elif new_version not in text:
              raise SystemExit("confidence methodology version anchor not found")

          for chain in ("arbitrum", "base"):
              anchor = f'''    "{chain}": ChainSignalProfile(\n        required_for_confidence=(\n            "tx_count_daily",\n            "block_count_daily",\n            "median_tx_fee_native",\n            "unique_active_addresses",\n            "avg_block_time_sec",\n        ),'''
              replacement = f'''    "{chain}": ChainSignalProfile(\n        required_for_confidence=(\n            "tx_count_daily",\n            "block_count_daily",\n            "median_tx_fee_native",\n            "unique_active_addresses",\n            "avg_block_time_sec",\n            "capacity_util_pct",\n        ),'''
              if anchor in text:
                  text = text.replace(anchor, replacement, 1)
              elif replacement not in text:
                  raise SystemExit(f"{chain} profile anchor not found")

          text = text.replace(
              '"Arbitrum confidence is scored against the L2 evidence surface and does not penalize hidden L1-only gas-utilization or failed-tx semantics.",',
              '"Arbitrum confidence is scored against the L2 evidence surface, including capacity utilization, and does not penalize hidden L1-only gas-utilization or failed-tx semantics.",',
              1,
          )
          text = text.replace(
              '"Base confidence is scored against the L2 evidence surface and does not penalize hidden L1-only gas-utilization or failed-tx semantics.",',
              '"Base confidence is scored against the L2 evidence surface, including capacity utilization, and does not penalize hidden L1-only gas-utilization or failed-tx semantics.",',
              1,
          )
          p.write_text(text, encoding="utf-8")

          manifest_path = Path("pipeline/methodology-version.json")
          manifest = json.loads(manifest_path.read_text(encoding="utf-8"))
          if manifest.get("methodology_version") not in {"2.2", "2.3"}:
              raise SystemExit(f"unexpected methodology version: {manifest.get('methodology_version')}")
          manifest["methodology_version"] = "2.3"
          manifest_path.write_text(json.dumps(manifest, indent=2) + "\n", encoding="utf-8")
          PY

      - name: Write L2 confidence semantics test
        run: |
          cat > pipeline/tools/test_l2_confidence_capacity_semantics.py <<'PY'
          #!/usr/bin/env python3
          from __future__ import annotations

          import pandas as pd

          from api.confidence_engine import (
              CHAIN_SIGNAL_PROFILES,
              CONFIDENCE_METHODOLOGY_VERSION,
              compute_data_quality_details_v2,
          )


          def frame(*, missing_latest_capacity: bool) -> pd.DataFrame:
              dates = pd.date_range("2026-01-01", periods=180, freq="D")
              rows = []
              for i, day in enumerate(dates):
                  rows.append(
                      {
                          "date": day.date(),
                          "tx_count_daily": 1000 + i,
                          "block_count_daily": 500 + i,
                          "median_tx_fee_native": 0.000001,
                          "unique_active_addresses": 900 + i,
                          "avg_block_time_sec": 2.0,
                          "capacity_util_pct": 0.75,
                      }
                  )
              if missing_latest_capacity:
                  rows[-1]["capacity_util_pct"] = None
              return pd.DataFrame(rows)


          def main() -> int:
              assert CONFIDENCE_METHODOLOGY_VERSION == "confidence_v3_l2_capacity_required"

              for chain in ("arbitrum", "base"):
                  required = CHAIN_SIGNAL_PROFILES[chain].required_for_confidence
                  assert "capacity_util_pct" in required, (chain, required)

                  complete = compute_data_quality_details_v2(
                      frame(missing_latest_capacity=False),
                      chain=chain,
                      asof_date="2026-06-29",
                  )
                  missing = compute_data_quality_details_v2(
                      frame(missing_latest_capacity=True),
                      chain=chain,
                      asof_date="2026-06-29",
                  )

                  assert complete["score"] == 1.0, (chain, complete)
                  assert missing["score"] is not None and missing["score"] < 1.0, (chain, missing)
                  assert missing["components"]["current_row_coverage"] == 5 / 6, (chain, missing)
                  assert "capacity_util_pct" in missing["components"]["required_metrics"], (chain, missing)

              print("OK: L2 capacity utilization is required by confidence semantics")
              return 0


          if __name__ == "__main__":
              raise SystemExit(main())
          PY

      - name: Run targeted test and governance validator
        run: |
          python pipeline/tools/test_l2_confidence_capacity_semantics.py
          python pipeline/tools/validate_meta_methodology_safety.py --root . --meta-root data/published/v1/meta

      - name: Assert scope and commit
        run: |
          git diff --check
          bad=$(git status --porcelain | awk '{print $2}' | grep -v -E '^(api/confidence_engine.py|pipeline/methodology-version.json|pipeline/tools/test_l2_confidence_capacity_semantics.py)$' || true)
          if [ -n "$bad" ]; then
            echo "Unexpected paths:"
            echo "$bad"
            exit 1
          fi

          if git diff --quiet -- api/confidence_engine.py pipeline/methodology-version.json pipeline/tools/test_l2_confidence_capacity_semantics.py && [ -f pipeline/tools/test_l2_confidence_capacity_semantics.py ]; then
            echo "No patch changes to commit."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add api/confidence_engine.py pipeline/methodology-version.json pipeline/tools/test_l2_confidence_capacity_semantics.py
          git commit -m "fix: require L2 capacity in confidence quality"
          git push origin HEAD:fix/l2-confidence-capacity-required
