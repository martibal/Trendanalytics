name: Daily Pipeline Publish

on:
  workflow_dispatch:
  schedule:
    - cron: "15 6 * * *"

concurrency:
  group: daily-pipeline-publish
  cancel-in-progress: false

jobs:
  publish:
    runs-on: windows-latest
    timeout-minutes: 180

    permissions:
      contents: write

    env:
      CSS_PYTHON: python
      CSS_SYNC_WEB: "0"
      CSS_CLEANUP_EPHEMERAL_RAW: "1"
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      DIRECT_URL: ${{ secrets.DIRECT_URL }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: web-v1-app/package-lock.json

      - name: Verify AWS CLI
        shell: pwsh
        run: |
          aws --version

      - name: Install Python dependencies
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          pip install -r .\pipeline\requirements.txt

      - name: Install web dependencies
        shell: pwsh
        working-directory: .\web-v1-app
        run: |
          npm ci

      - name: Generate Prisma client
        shell: pwsh
        working-directory: .\web-v1-app
        run: |
          npx prisma generate --schema .\prisma\schema.prisma

      - name: Configure git identity
        shell: pwsh
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Seed published state from committed web snapshot
        shell: pwsh
        run: |
          $src = Join-Path $env:GITHUB_WORKSPACE 'web-v1-app\public\data\published\v1'
          $dst = Join-Path $env:GITHUB_WORKSPACE 'data\published\v1'

          if (!(Test-Path $src)) {
            throw "Missing source published snapshot: $src"
          }

          if (Test-Path $dst) {
            Remove-Item $dst -Recurse -Force
          }

          New-Item -ItemType Directory -Force -Path $dst | Out-Null

          robocopy $src $dst /MIR /NFL /NDL /NJH /NJS /NP
          if ($LASTEXITCODE -gt 7) {
            throw "robocopy failed with exit code $LASTEXITCODE"
          }

          Write-Host "Seeded published state from committed web snapshot."

      - name: Run daily incremental pipeline
        shell: pwsh
        run: |
          powershell -ExecutionPolicy Bypass -File .\run-daily-pipeline.ps1

      - name: Upload pipeline artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: daily-pipeline-artifacts
          path: |
            logs
            reports
            pipeline/_work/prod/status
          if-no-files-found: ignore