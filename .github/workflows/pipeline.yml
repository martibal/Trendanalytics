name: Daily Pipeline Publish

on:
  workflow_dispatch:
  schedule:
    - cron: '0 6 * * *'
    - cron: '0 18 * * *'

concurrency:
  group: daily-pipeline-publish
  cancel-in-progress: false

jobs:
  publish:
    if: github.ref == 'refs/heads/main'
    runs-on: windows-latest
    timeout-minutes: 180

    permissions:
      contents: write

    env:
      CSS_PYTHON: python
      CSS_SYNC_WEB: "0"
      CSS_RAW_LOOKBACK_DAYS: "90"
      CSS_JSON_FINALIZER_LOOKBACK_DAYS: "90"
      CSS_CLEANUP_EPHEMERAL_RAW: "1"
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true
          clean: true

      - name: Configure git identity
        shell: pwsh
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git config pull.rebase true

      - name: Sync checkout to latest origin/main
        shell: pwsh
        run: |
          git fetch origin main --prune
          git checkout main
          git reset --hard origin/main

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: web-v1-app/package-lock.json

      - name: Verify AWS CLI
        shell: pwsh
        run: |
          aws --version

      - name: Install Python dependencies
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          pip install -r .\pipeline\requirements.txt

      - name: Install web dependencies
        shell: pwsh
        working-directory: .\web-v1-app
        run: |
          npm ci

      - name: Generate Prisma client
        shell: pwsh
        working-directory: .\web-v1-app
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          DIRECT_URL: ${{ secrets.DIRECT_URL }}
        run: |
          npx prisma generate --schema .\prisma\schema.prisma

      - name: Seed published state from committed web snapshot
        shell: pwsh
        run: |
          $src = Join-Path $env:GITHUB_WORKSPACE 'web-v1-app\public\data\published\v1'
          $dst = Join-Path $env:GITHUB_WORKSPACE 'data\published\v1'

          if (!(Test-Path $src)) {
            throw "Missing source published snapshot: $src"
          }

          if (Test-Path $dst) {
            Remove-Item $dst -Recurse -Force
          }

          New-Item -ItemType Directory -Force -Path $dst | Out-Null

          robocopy $src $dst /MIR /NFL /NDL /NJH /NJS /NP
          $rc = $LASTEXITCODE

          if ($rc -gt 7) {
            throw "robocopy failed with exit code $rc"
          }

          Write-Host "Seeded published state from committed web snapshot. robocopy exit code: $rc"

          $global:LASTEXITCODE = 0
          exit 0

      - name: Run daily incremental pipeline with V3 JSON finalizer (commit locally, no push)
        shell: pwsh
        run: |
          powershell -ExecutionPolicy Bypass -File .\run-daily-pipeline.ps1 -SkipPush

      - name: Verify V3 methodology output before push
        if: success()
        shell: pwsh
        run: |
          python pipeline/tools/validate_meta_methodology_safety.py --root .
          python pipeline/tools/validate_meta_methodology_safety.py --root . --meta-root web-v1-app/public/data/published/v1/meta

          if (!(Test-Path "web-v1-app/public/data/published/v1/meta")) {
            throw "Missing web-v1-app published META output."
          }

          if (!(Test-Path "web-v1-app/public/data/published/v1/briefs/site/latest.json")) {
            throw "Missing Regime Briefs site bundle: web-v1-app/public/data/published/v1/briefs/site/latest.json"
          }

      - name: Push local published-data commit with remote sync
        id: push_data
        if: success()
        shell: pwsh
        run: |
          "pushed=false" >> $env:GITHUB_OUTPUT

          git fetch origin main --prune
          if ($LASTEXITCODE -ne 0) {
            throw "Failed to fetch origin/main before evaluating push state."
          }

          $aheadRaw = git rev-list --count "origin/main..HEAD"
          if ($LASTEXITCODE -ne 0) {
            throw "Failed to calculate local-ahead commit count."
          }

          $ahead = [int]$aheadRaw.Trim()

          if ($ahead -eq 0) {
            Write-Host "No local commit to push. Skipping push and Vercel deploy."
            exit 0
          }

          $maxAttempts = 3

          for ($attempt = 1; $attempt -le $maxAttempts; $attempt++) {
            Write-Host "Push attempt $attempt of $maxAttempts"

            git fetch origin main --prune
            if ($LASTEXITCODE -ne 0) {
              throw "git fetch failed before push attempt $attempt"
            }

            $statusLines = git status --porcelain
            if ($LASTEXITCODE -ne 0) {
              throw "git status failed before rebase on attempt $attempt"
            }

            $statusText = ($statusLines | Out-String).Trim()

            if (-not [string]::IsNullOrWhiteSpace($statusText)) {
              Write-Host "Working tree is dirty before rebase. Autostashing remaining changes:"
              $statusLines | ForEach-Object { Write-Host "  $_" }

              git stash push --include-untracked -m "workflow-autostash-before-rebase"
              if ($LASTEXITCODE -ne 0) {
                throw "git stash failed on attempt $attempt"
              }
            }

            git pull --rebase origin main
            if ($LASTEXITCODE -ne 0) {
              git rebase --abort 2>$null
              throw "git pull --rebase failed on attempt $attempt"
            }

            $aheadAfterRebaseRaw = git rev-list --count "origin/main..HEAD"
            if ($LASTEXITCODE -ne 0) {
              throw "Failed to recalculate local-ahead commit count after rebase."
            }

            $aheadAfterRebase = [int]$aheadAfterRebaseRaw.Trim()

            if ($aheadAfterRebase -eq 0) {
              Write-Host "No net new commit remains after rebase. Skipping push and Vercel deploy."
              exit 0
            }

            git push origin HEAD:main
            if ($LASTEXITCODE -eq 0) {
              Write-Host "Push succeeded on attempt $attempt"
              "pushed=true" >> $env:GITHUB_OUTPUT
              exit 0
            }

            if ($attempt -lt $maxAttempts) {
              Write-Host "Push was rejected; retrying after remote sync..."
              Start-Sleep -Seconds 5
            }
          }

          throw "git push failed after $maxAttempts attempts"

      - name: Trigger Vercel production deployment
        if: success() && steps.push_data.outputs.pushed == 'true'
        shell: pwsh
        env:
          VERCEL_DEPLOY_HOOK_URL: ${{ secrets.VERCEL_DEPLOY_HOOK_URL }}
        run: |
          if ([string]::IsNullOrWhiteSpace($env:VERCEL_DEPLOY_HOOK_URL)) {
            throw "Missing required secret: VERCEL_DEPLOY_HOOK_URL"
          }

          Write-Host "New data commit was pushed. Triggering Vercel deploy hook..."
          $response = Invoke-RestMethod `
            -Method Post `
            -Uri $env:VERCEL_DEPLOY_HOOK_URL `
            -ContentType "application/json"

          $response | ConvertTo-Json -Depth 10

      - name: Scan pipeline artifacts for accidental secrets
        if: always()
        shell: pwsh
        run: |
          $roots = @(
            "logs",
            "reports",
            "pipeline\_work\prod\status"
          )

          $patterns = [ordered]@{
            "stripe_live_secret" = "sk_live_[A-Za-z0-9]+"
            "stripe_restricted_live" = "rk_live_[A-Za-z0-9]+"
            "stripe_webhook_secret" = "whsec_[A-Za-z0-9]+"
            "aws_access_key_id" = "AKIA[0-9A-Z]{16}"
            "private_key_block" = "-----BEGIN .*PRIVATE KEY-----"
            "postgres_connection_url" = "postgres(?:ql)?://[^ `"`"']+"
            "database_url_assignment" = "DATABASE_URL\s*="
            "direct_url_assignment" = "DIRECT_URL\s*="
            "clerk_secret_assignment" = "CLERK_SECRET_KEY\s*="
            "stripe_secret_assignment" = "STRIPE_SECRET_KEY\s*="
            "upstash_token_assignment" = "UPSTASH_REDIS_REST_TOKEN\s*="
          }

          $hits = New-Object System.Collections.Generic.List[object]

          foreach ($root in $roots) {
            $rootPath = Join-Path $env:GITHUB_WORKSPACE $root

            if (!(Test-Path -LiteralPath $rootPath)) {
              continue
            }

            Get-ChildItem -LiteralPath $rootPath -Recurse -File -ErrorAction SilentlyContinue |
              ForEach-Object {
                $file = $_.FullName
                $lineNo = 0

                Get-Content -LiteralPath $file -ErrorAction SilentlyContinue |
                  ForEach-Object {
                    $lineNo++

                    foreach ($name in $patterns.Keys) {
                      if ($_ -match $patterns[$name]) {
                        $hits.Add([pscustomobject]@{
                          Kind = $name
                          File = $file.Replace($env:GITHUB_WORKSPACE, "").TrimStart("\", "/")
                          Line = $lineNo
                        })
                      }
                    }
                  }
              }
          }

          if ($hits.Count -gt 0) {
            Write-Host "Potential secret material detected in workflow artifacts. Values are intentionally not printed."
            $hits | Sort-Object Kind, File, Line | Format-Table -AutoSize
            throw "Refusing to upload artifacts that may contain secrets."
          }

          Write-Host "Artifact secret scan passed."
      - name: Upload pipeline artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: daily-pipeline-artifacts
          path: |
            logs
            reports
            pipeline/_work/prod/status
          if-no-files-found: ignore
          retention-days: 7
