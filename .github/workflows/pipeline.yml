name: Pipeline Publish

on:
  workflow_dispatch:
  schedule:
    - cron: "15 6 * * *"

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 90

    permissions:
      contents: read

    env:
      CSS_PYTHON: python3
      CSS_SYNC_WEB: "0"
      CSS_RAW_LOOKBACK_DAYS: "45"
      METHODOLOGY_VERSION: "1.0"
      PUBLISHED_S3_URI: s3://${{ secrets.PUBLISHED_S3_BUCKET }}/${{ secrets.PUBLISHED_S3_PREFIX }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r pipeline/requirements.txt

      - name: Install PowerShell
        run: |
          sudo apt-get update
          sudo apt-get install -y powershell

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Verify AWS access
        run: aws sts get-caller-identity

      - name: Run pipeline
        shell: pwsh
        run: ./pipeline/tools/full_pipeline.ps1 -Mode incremental -SkipWebSync

      - name: Upload published dataset to S3
        run: aws s3 sync ./data/published/v1 "$PUBLISHED_S3_URI" --delete --only-show-errors

      - name: Upload reports artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pipeline-reports
          path: |
            pipeline/_work/prod/reports
            reports
          if-no-files-found: ignore
