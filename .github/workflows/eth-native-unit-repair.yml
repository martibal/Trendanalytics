name: Ethereum Native Unit Repair

on:
  workflow_dispatch:
  push:
    branches:
      - agent/eth-native-unit-repair
    paths:
      - .github/workflows/eth-native-unit-repair.yml
      - pipeline/tools/validate_native_units.py

permissions:
  contents: write

jobs:
  repair:
    runs-on: windows-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repair branch
        uses: actions/checkout@v4
        with:
          ref: agent/eth-native-unit-repair
          fetch-depth: 0
          persist-credentials: true

      - name: Configure git identity
        shell: pwsh
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install pipeline dependencies
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          pip install -r .\pipeline\requirements.txt
          aws --version

      - name: Download exact Ethereum 2026-08-06 raw source
        shell: pwsh
        run: |
          $day = "2026-08-06"
          foreach ($table in @("transactions", "blocks")) {
            $base = "s3://aws-public-blockchain/v1.0/eth/$table/"
            $listing = aws s3 ls $base --no-sign-request
            if ($LASTEXITCODE -ne 0) {
              throw "Failed listing $base"
            }
            $match = $listing | Select-String $day | Select-Object -First 1
            if ($null -eq $match) {
              throw "Could not locate source prefix for ethereum/$table/$day"
            }
            $tokens = @($match.Line -split '\s+' | Where-Object { -not [string]::IsNullOrWhiteSpace($_) })
            $prefix = $tokens[-1]
            $dest = Join-Path $env:GITHUB_WORKSPACE "data\raw\ethereum\$table\date=$day"
            New-Item -ItemType Directory -Force -Path $dest | Out-Null
            Write-Host "Syncing $base$prefix -> $dest"
            aws s3 sync "$base$prefix" "$dest" --no-sign-request --only-show-errors
            if ($LASTEXITCODE -ne 0) {
              throw "Failed downloading ethereum/$table/$day"
            }
          }

      - name: Recompute exact daily feature row with current aggregator
        shell: pwsh
        run: |
          python pipeline/src/feature_daily_agg.py `
            --chain ethereum `
            --date 2026-08-06 `
            --raw_root data/raw `
            --out_root pipeline/_work/eth-unit-repair/features_agg
          if ($LASTEXITCODE -ne 0) {
            throw "Feature aggregation failed"
          }

      - name: Replace canonical Gold day from recomputed parquet
        shell: pwsh
        run: |
          @'
          import json
          import math
          from pathlib import Path
          import polars as pl

          source = Path("pipeline/_work/eth-unit-repair/features_agg/ethereum/2026-08-06.parquet")
          frame = pl.read_parquet(source)
          if frame.height != 1:
              raise SystemExit(f"expected one feature row, got {frame.height}")
          row = frame.to_dicts()[0]

          def clean(value):
              if value is None:
                  return None
              if isinstance(value, float) and not math.isfinite(value):
                  return None
              return value

          row = {key: clean(value) for key, value in row.items()}
          if row.get("date") != "2026-08-06" or row.get("chain") != "ethereum":
              raise SystemExit(f"unexpected row identity: {row.get('date')} {row.get('chain')}")

          fee = float(row["median_tx_fee_native"])
          value = float(row["median_tx_value_native"])
          transferred = float(row["value_transferred_native"])
          if not (0 <= fee < 100):
              raise SystemExit(f"recomputed fee still looks non-native: {fee}")
          if not (0 <= value < 1_000_000_000):
              raise SystemExit(f"recomputed median value still looks non-native: {value}")
          if not (0 <= transferred < 1_000_000_000_000):
              raise SystemExit(f"recomputed transferred value still looks non-native: {transferred}")

          payload = json.dumps(row, ensure_ascii=False, indent=2, sort_keys=True, allow_nan=False) + "\n"
          targets = [
              Path("data/published/v1/gold/ethereum/2026-08-06.json"),
              Path("data/calculated/gold_json/ethereum/2026-08-06.json"),
          ]
          for target in targets:
              target.parent.mkdir(parents=True, exist_ok=True)
              target.write_text(payload, encoding="utf-8")
              print(f"wrote {target}")
          print(json.dumps(row, indent=2, sort_keys=True))
          '@ | python -
          if ($LASTEXITCODE -ne 0) {
            throw "Failed materializing corrected Gold day"
          }

      - name: Regenerate META Derived windows briefs and private mirror
        shell: pwsh
        run: |
          python pipeline/tools/regenerate_json_safe.py --root . --start 2024-12-01
          if ($LASTEXITCODE -ne 0) {
            throw "JSON regeneration failed"
          }

      - name: Validate native units and methodology
        shell: pwsh
        run: |
          python pipeline/tools/validate_native_units.py --published-root data/published/v1
          if ($LASTEXITCODE -ne 0) { throw "Native-unit validation failed" }
          python pipeline/tools/validate_meta_methodology_safety.py --root . --meta-root data/published/v1/meta
          if ($LASTEXITCODE -ne 0) { throw "META methodology validation failed" }

      - name: Verify repaired ETH rolling and META values
        shell: pwsh
        run: |
          @'
          import json
          import math
          from pathlib import Path

          gold = json.loads(Path("data/published/v1/gold/ethereum/2026-08-06.json").read_text(encoding="utf-8"))
          derived = json.loads(Path("data/published/v1/derived/ethereum/latest.json").read_text(encoding="utf-8"))
          meta = json.loads(Path("data/published/v1/meta/ethereum/latest.json").read_text(encoding="utf-8"))

          fee = float(gold["median_tx_fee_native"])
          ma7 = float(derived["derived"]["metrics"]["median_tx_fee_native__ma7"])
          momentum = float(meta["regime"]["signals"]["median_tx_fee_native"]["momentum_7d_vs_30d"])
          if not (0 <= fee < 100):
              raise SystemExit(f"bad repaired fee: {fee}")
          if not (0 <= ma7 < 100):
              raise SystemExit(f"bad derived fee MA7: {ma7}")
          if not math.isfinite(momentum) or abs(momentum) > 100:
              raise SystemExit(f"bad fee momentum after repair: {momentum}")
          print(f"ETH repair OK fee={fee} ma7={ma7} momentum={momentum}")
          '@ | python -
          if ($LASTEXITCODE -ne 0) {
            throw "Post-repair verification failed"
          }

      - name: Commit repaired canonical outputs
        shell: pwsh
        run: |
          git add -- `
            data/published/v1 `
            web-v1-app/.private-data/published/v1 `
            data/calculated/gold_json/ethereum/2026-08-06.json `
            data/calculated/meta/ethereum

          if (-not (git status --porcelain)) {
            throw "Repair produced no repository changes"
          }

          git commit -m "Repair Ethereum native-unit history"
          git push origin HEAD:agent/eth-native-unit-repair
