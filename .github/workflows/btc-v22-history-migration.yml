name: BTC v2.2 History Migration

on:
  push:
    branches:
      - agent/btc-v22-history-migration
    paths:
      - .github/workflows/btc-v22-history-migration.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  extract:
    name: Extract BTC block weight ${{ matrix.start }} to ${{ matrix.end }}
    runs-on: ubuntu-latest
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        include:
          - start: "2024-12-01"
            end: "2025-02-28"
            key: "2024-12_2025-02"
          - start: "2025-03-01"
            end: "2025-05-31"
            key: "2025-03_2025-05"
          - start: "2025-06-01"
            end: "2025-08-31"
            key: "2025-06_2025-08"
          - start: "2025-09-01"
            end: "2025-11-30"
            key: "2025-09_2025-11"
          - start: "2025-12-01"
            end: "2026-02-28"
            key: "2025-12_2026-02"
          - start: "2026-03-01"
            end: "2026-05-31"
            key: "2026-03_2026-05"
          - start: "2026-06-01"
            end: "2026-08-09"
            key: "2026-06_2026-08"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Polars
        run: |
          python -m pip install --upgrade pip
          pip install polars pyarrow

      - name: Verify AWS CLI
        run: aws --version

      - name: Download BTC blocks and extract block-weight utilization
        env:
          CHUNK_START: ${{ matrix.start }}
          CHUNK_END: ${{ matrix.end }}
          CHUNK_KEY: ${{ matrix.key }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .migration/raw .migration/out
          python - <<'PY'
          from __future__ import annotations
          import json
          import os
          import shutil
          import subprocess
          from datetime import date, timedelta
          from pathlib import Path
          import polars as pl

          start = date.fromisoformat(os.environ["CHUNK_START"])
          end = date.fromisoformat(os.environ["CHUNK_END"])
          key = os.environ["CHUNK_KEY"]
          raw_root = Path(".migration/raw")
          out_root = Path(".migration/out")
          values = {}
          failures = []

          def has_parquet(p: Path) -> bool:
              return p.exists() and any(x.is_file() and x.suffix == ".parquet" and x.stat().st_size > 0 for x in p.rglob("*.parquet"))

          def sync_day(day: str, dst: Path) -> None:
              dst.mkdir(parents=True, exist_ok=True)
              sources = [
                  f"s3://aws-public-blockchain/v1.0/btc/blocks/date={day}/",
                  f"s3://aws-public-blockchain/v1.0/btc/blocks/{day}/",
              ]
              for src in sources:
                  cp = subprocess.run([
                      "aws", "s3", "sync", src, str(dst),
                      "--no-sign-request", "--only-show-errors",
                  ], timeout=240)
                  if cp.returncode == 0 and has_parquet(dst):
                      return
                  if dst.exists():
                      shutil.rmtree(dst)
                      dst.mkdir(parents=True, exist_ok=True)
              raise RuntimeError(f"unable to download BTC blocks for {day}")

          def compute(day: str, day_dir: Path) -> float:
              files = sorted(day_dir.rglob("*.parquet"))
              frames = []
              for path in files:
                  frames.append(pl.read_parquet(path))
              if not frames:
                  raise RuntimeError("no parquet files")
              df = pl.concat(frames, how="diagonal_relaxed") if len(frames) > 1 else frames[0]
              ci = {c.lower(): c for c in df.columns}
              name = ci.get("weight") or ci.get("block_weight")
              if not name:
                  raise RuntimeError(f"weight column missing; columns={df.columns}")
              s = df.get_column(name).cast(pl.Float64, strict=False).drop_nulls()
              if s.len() == 0:
                  raise RuntimeError("weight column has no finite values")
              value = float(s.mean()) / 4_000_000.0
              if not (0.0 <= value <= 1.0):
                  raise RuntimeError(f"out-of-range utilization {value}")
              return value

          day = start
          while day <= end:
              ds = day.isoformat()
              dst = raw_root / ds
              try:
                  sync_day(ds, dst)
                  values[ds] = compute(ds, dst)
              except Exception as exc:
                  failures.append({"date": ds, "error": str(exc)})
              finally:
                  if dst.exists():
                      shutil.rmtree(dst)
              day += timedelta(days=1)

          expected = (end - start).days + 1
          report = {
              "chunk": key,
              "start": start.isoformat(),
              "end": end.isoformat(),
              "expected_days": expected,
              "produced_days": len(values),
              "failures": failures,
              "values": values,
          }
          target = out_root / f"{key}.json"
          target.write_text(json.dumps(report, indent=2, sort_keys=True) + "\n", encoding="utf-8")
          print(json.dumps({k: report[k] for k in ["chunk", "start", "end", "expected_days", "produced_days", "failures"]}, indent=2))
          if failures or len(values) != expected:
              raise SystemExit(f"chunk incomplete: expected={expected} produced={len(values)} failures={len(failures)}")
          PY

      - name: Upload chunk
        uses: actions/upload-artifact@v4
        with:
          name: btc-weight-${{ matrix.key }}
          path: .migration/out/${{ matrix.key }}.json
          if-no-files-found: error
          retention-days: 7

  apply:
    name: Apply BTC v2.2 history migration
    needs: extract
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout migration branch
        uses: actions/checkout@v4
        with:
          ref: agent/btc-v22-history-migration
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web-v1-app/package-lock.json

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r pipeline/requirements.txt
          cd web-v1-app
          npm ci

      - name: Download extracted block-weight chunks
        uses: actions/download-artifact@v4
        with:
          pattern: btc-weight-*
          path: .migration/weights
          merge-multiple: true

      - name: Patch canonical BTC Gold with 100 percent coverage guard
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from __future__ import annotations
          import json
          import math
          from datetime import date, timedelta
          from pathlib import Path

          start = date(2024, 12, 1)
          end = date(2026, 8, 9)
          expected_count = (end - start).days + 1
          chunks = sorted(Path('.migration/weights').glob('*.json'))
          if len(chunks) != 7:
              raise SystemExit(f"expected 7 chunk artifacts, found {len(chunks)}")

          values = {}
          for path in chunks:
              obj = json.loads(path.read_text(encoding='utf-8'))
              if obj.get('failures'):
                  raise SystemExit(f"chunk reports failures: {path}")
              for day, value in obj.get('values', {}).items():
                  if day in values:
                      raise SystemExit(f"duplicate day across chunks: {day}")
                  v = float(value)
                  if not math.isfinite(v) or not (0.0 <= v <= 1.0):
                      raise SystemExit(f"invalid utilization {day}: {value}")
                  values[day] = v

          expected_days = []
          d = start
          while d <= end:
              expected_days.append(d.isoformat())
              d += timedelta(days=1)
          missing = [d for d in expected_days if d not in values]
          extra = sorted(set(values) - set(expected_days))
          if missing or extra or len(values) != expected_count:
              raise SystemExit(f"coverage mismatch expected={expected_count} actual={len(values)} missing={missing[:10]} extra={extra[:10]}")

          gold_dir = Path('data/published/v1/gold/bitcoin')
          missing_gold = [d for d in expected_days if not (gold_dir / f'{d}.json').exists()]
          if missing_gold:
              raise SystemExit(f"published Gold is missing expected BTC day files: {missing_gold[:10]}")

          # Cross-check a previously validated production day before mutating history.
          known = values['2026-08-09']
          expected_known = 0.9918125034965034
          if abs(known - expected_known) > 1e-12:
              raise SystemExit(f"known-day mismatch 2026-08-09 expected={expected_known} computed={known}")

          changed = 0
          for day in expected_days:
              path = gold_dir / f'{day}.json'
              obj = json.loads(path.read_text(encoding='utf-8'))
              old = obj.get('block_weight_utilization_pct')
              new = values[day]
              obj['block_weight_utilization_pct'] = new
              rendered = json.dumps(obj, ensure_ascii=False, indent=2, sort_keys=True, allow_nan=False)
              if path.read_text(encoding='utf-8') != rendered:
                  changed += 1
                  path.write_text(rendered, encoding='utf-8')

          print(f"BTC Gold coverage={len(values)}/{expected_count}; changed_day_files={changed}")
          PY

      - name: Rebuild BTC Gold windows
        run: |
          python pipeline/tools/rebuild_windows_from_dayfiles.py \
            --root data/published/v1 \
            --genres gold \
            --chains bitcoin \
            --windows 7,30,90,180,365

      - name: Rebuild full BTC META history under v2.2 engine
        run: |
          python pipeline/tools/export_meta_json_history.py \
            --root . \
            --out-root data/published/v1/meta \
            --start 2024-12-01 \
            --mode rebuild \
            --chains bitcoin \
            --windows 7,30,90,180,365

      - name: Validate BTC v2.2 META coverage and semantics
        run: |
          python - <<'PY'
          import json
          from datetime import date, timedelta
          from pathlib import Path

          start = date(2024, 12, 1)
          end = date(2026, 8, 9)
          root = Path('data/published/v1/meta/bitcoin')
          failures = []
          d = start
          count = 0
          while d <= end:
              day = d.isoformat()
              path = root / f'{day}.json'
              if not path.exists():
                  failures.append(f'{day}: missing meta')
              else:
                  obj = json.loads(path.read_text(encoding='utf-8'))
                  regime = obj.get('regime') or {}
                  signals = regime.get('signals') or {}
                  if regime.get('ruleset_id') != 'btc_v2':
                      failures.append(f"{day}: ruleset={regime.get('ruleset_id')}")
                  if 'block_weight_utilization_pct' not in signals:
                      failures.append(f'{day}: block weight signal missing')
                  count += 1
              d += timedelta(days=1)
          if failures:
              raise SystemExit('BTC META validation failed: ' + '; '.join(failures[:20]))
          print(f'BTC META btc_v2 validated for {count} day files')
          PY
          python pipeline/tools/validate_meta_methodology_safety.py --root . --meta-root data/published/v1/meta

      - name: Rebuild Regime Briefs from migrated canonical data
        working-directory: web-v1-app
        run: |
          python scripts/build_briefs/build_all_briefs.py --root ../data/published/v1

      - name: Mirror canonical published data to private snapshot
        run: |
          python - <<'PY'
          import shutil
          from pathlib import Path
          src = Path('data/published/v1')
          dst = Path('web-v1-app/.private-data/published/v1')
          if dst.exists():
              shutil.rmtree(dst)
          shutil.copytree(src, dst)
          PY

      - name: Verify canonical and private are byte-identical
        run: |
          python - <<'PY'
          import hashlib
          from pathlib import Path
          a = Path('data/published/v1')
          b = Path('web-v1-app/.private-data/published/v1')
          af = {p.relative_to(a): p for p in a.rglob('*') if p.is_file()}
          bf = {p.relative_to(b): p for p in b.rglob('*') if p.is_file()}
          if set(af) != set(bf):
              raise SystemExit(f'file-set mismatch canonical={len(af)} private={len(bf)}')
          bad = []
          for rel in af:
              ha = hashlib.sha256(af[rel].read_bytes()).digest()
              hb = hashlib.sha256(bf[rel].read_bytes()).digest()
              if ha != hb:
                  bad.append(str(rel))
          if bad:
              raise SystemExit('byte mismatch: ' + ', '.join(bad[:20]))
          print(f'canonical/private byte-identical across {len(af)} files')
          PY

      - name: Run audit gates
        working-directory: web-v1-app
        run: npm run check:audit-gates:no-build

      - name: Assert migration scope
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          bad=$(git status --porcelain | awk '{print $2}' | grep -v -E '^(.github/workflows/btc-v22-history-migration.yml|data/published/v1/gold/bitcoin/|data/published/v1/meta/bitcoin/|data/published/v1/briefs/|web-v1-app/.private-data/published/v1/)' || true)
          if [ -n "$bad" ]; then
            echo "Unexpected migration paths:"
            echo "$bad"
            exit 1
          fi

      - name: Commit migrated BTC history to migration branch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/published/v1/gold/bitcoin data/published/v1/meta/bitcoin data/published/v1/briefs web-v1-app/.private-data/published/v1
          if git diff --cached --quiet; then
            echo "No migration changes to commit"
            exit 1
          fi
          git commit -m "chore(data): migrate BTC history to methodology v2.2"
          git push origin HEAD:agent/btc-v22-history-migration
