name: Bitcoin schema probe

on:
  push:
    branches:
      - agent/bitcoin-nested-io-correctness

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install pyarrow
        run: pip install 'pyarrow>=18,<19'
      - name: Probe BTC transaction parquet schema
        shell: bash
        run: |
          set -euo pipefail
          PREFIX='s3://aws-public-blockchain/v1.0/btc/transactions/date=2026-08-06/'
          aws s3 ls "$PREFIX" --recursive --no-sign-request > /tmp/btc_ls.txt
          cat /tmp/btc_ls.txt | head -20
          LINE=$(awk '/\.parquet$/ {print $3 " " $4}' /tmp/btc_ls.txt | sort -n | head -1)
          SIZE=$(echo "$LINE" | awk '{print $1}')
          KEY=$(echo "$LINE" | cut -d' ' -f2-)
          if [ -z "$KEY" ]; then echo 'No parquet file found'; exit 1; fi
          echo "selected_size=$SIZE"
          echo "selected_key=$KEY"
          aws s3 cp "s3://aws-public-blockchain/$KEY" /tmp/btc.parquet --no-sign-request --only-show-errors
          python - <<'PY'
          import pyarrow.parquet as pq
          pf = pq.ParquetFile('/tmp/btc.parquet')
          print('schema_arrow=')
          print(pf.schema_arrow)
          print('row_groups=', pf.num_row_groups)
          cols = [c for c in ['inputs','outputs','input_value','output_value','fee','virtual_size','is_coinbase'] if c in pf.schema_arrow.names]
          print('selected_columns=', cols)
          table = pf.read_row_group(0, columns=cols).slice(0, 3)
          print('sample=')
          for row in table.to_pylist():
              print(row)
          PY
