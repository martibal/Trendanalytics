name: Bitcoin nested IO correctness patch

on:
  push:
    branches:
      - agent/bitcoin-nested-io-correctness

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install pipeline dependencies
        run: pip install -r pipeline/requirements.txt
      - name: Apply focused patch
        run: python .agent/patch_btc_nested_io.py
      - name: Run focused golden fixture
        working-directory: web-v1-app
        run: node scripts/pipeline-golden-fixture.mjs
      - name: Validate Python syntax
        run: python -m py_compile pipeline/src/feature_daily_agg.py
      - name: Commit product changes
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add pipeline/src/feature_daily_agg.py pipeline/methodology-version.json web-v1-app/scripts/pipeline-golden-fixture.mjs
          git diff --cached --check
          git status --short
          git commit -m "Parse Bitcoin nested inputs and outputs correctly"
          git push origin HEAD:agent/bitcoin-nested-io-correctness
