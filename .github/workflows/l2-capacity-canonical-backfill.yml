name: L2 Capacity Canonical Backfill

on:
  push:
    branches:
      - agent/l2-capacity-canonical-backfill
    paths:
      - ".github/workflows/l2-capacity-canonical-backfill.yml"
      - "pipeline/tools/apply_l2_capacity_backfill_seed.py"
  workflow_dispatch:

jobs:
  apply-and-validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      actions: read
      contents: write

    steps:
      - name: Checkout canonical backfill branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install pipeline dependencies
        run: pip install -r pipeline/requirements.txt

      - name: Download exact validated combined backfill artifact
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p .validated-l2-backfill
          gh run download 31304152726 \
            --repo martibal/Trendanalytics \
            --name l2-capacity-backfill-combined \
            --dir .validated-l2-backfill
          sha256sum .validated-l2-backfill/l2-capacity-backfill-combined.json
          test "$(sha256sum .validated-l2-backfill/l2-capacity-backfill-combined.json | cut -d' ' -f1)" = "f2d41750cf1cbeb13786903b6c351331f50154de2980968911a0f910582993d0"

      - name: Apply validated capacity seed to published Gold
        run: |
          python pipeline/tools/apply_l2_capacity_backfill_seed.py \
            --seed .validated-l2-backfill/l2-capacity-backfill-combined.json \
            --published-root data/published/v1

      - name: Regenerate META and Derived from canonical published Gold
        run: |
          python pipeline/tools/regenerate_json_safe.py \
            --root . \
            --start 2024-12-01 \
            --skip-web-sync \
            --skip-briefs

      - name: Run publication validators
        run: |
          python pipeline/tools/validate_published_dataset.py \
            --published-root data/published/v1
          python pipeline/tools/validate_meta_methodology_safety.py \
            --root . \
            --meta-root data/published/v1/meta

      - name: Verify L2 capacity is informative in latest META
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          expected = {
              "arbitrum": ("arbitrum_l1_gas_used_daily", 0.09217485575914006),
              "base": ("base_l1_gas_used_daily", 0.5062384755062305),
          }
          for chain, (raw_key, expected_capacity) in expected.items():
              gold = json.loads(Path(f"data/published/v1/gold/{chain}/2026-08-02.json").read_text(encoding="utf-8"))
              assert raw_key in gold, (chain, raw_key)
              assert abs(float(gold["capacity_util_pct"]) - expected_capacity) < 1e-12, chain
              if chain == "base":
                  assert "base_blob_gas_used_daily" not in gold

              meta = json.loads(Path(f"data/published/v1/meta/{chain}/latest.json").read_text(encoding="utf-8"))
              regime = meta.get("regime") or {}
              signals = regime.get("signals") or {}
              axis = (regime.get("axes") or {}).get("capacity") or {}
              assert "capacity_util_pct" in signals, (chain, signals.keys())
              assert signals["capacity_util_pct"].get("informative") is True, (chain, signals["capacity_util_pct"])
              assert int(axis.get("informative_count") or 0) >= 1, (chain, axis)
              print(chain, "label=", regime.get("label"), "capacity_axis=", axis, "capacity_signal=", signals["capacity_util_pct"])
          PY

      - name: Restore non-L2 published layers from main
        run: |
          git fetch origin main --depth=1
          git checkout origin/main -- \
            data/published/v1/meta/bitcoin \
            data/published/v1/meta/ethereum \
            data/published/v1/derived/bitcoin \
            data/published/v1/derived/ethereum

          echo "Diff after non-L2 restore:"
          git diff --stat

      - name: Revalidate scoped published dataset
        run: |
          python pipeline/tools/validate_published_dataset.py \
            --published-root data/published/v1
          python pipeline/tools/validate_meta_methodology_safety.py \
            --root . \
            --meta-root data/published/v1/meta

          python - <<'PY'
          import json
          from pathlib import Path
          for chain in ("arbitrum", "base"):
              meta = json.loads(Path(f"data/published/v1/meta/{chain}/latest.json").read_text(encoding="utf-8"))
              signal = ((meta.get("regime") or {}).get("signals") or {}).get("capacity_util_pct") or {}
              axis = ((meta.get("regime") or {}).get("axes") or {}).get("capacity") or {}
              assert signal.get("informative") is True, (chain, signal)
              assert int(axis.get("informative_count") or 0) >= 1, (chain, axis)
          print("Scoped L2 publication validation OK")
          PY

      - name: Sync canonical published data to private web mirror
        shell: pwsh
        run: |
          ./sync-published-data.ps1 `
            -SourceRoot "${{ github.workspace }}/data/published/v1" `
            -TargetRoot "${{ github.workspace }}/web-v1-app/.private-data/published/v1" `
            -SkipGitStatus

      - name: Verify private mirror byte identity
        run: |
          python - <<'PY'
          from pathlib import Path
          import hashlib

          source = Path("data/published/v1")
          mirror = Path("web-v1-app/.private-data/published/v1")

          source_files = sorted(p.relative_to(source) for p in source.rglob("*") if p.is_file())
          mirror_files = sorted(p.relative_to(mirror) for p in mirror.rglob("*") if p.is_file())
          assert source_files == mirror_files, (len(source_files), len(mirror_files))

          for rel in source_files:
              a = source / rel
              b = mirror / rel
              ah = hashlib.sha256(a.read_bytes()).digest()
              bh = hashlib.sha256(b.read_bytes()).digest()
              assert ah == bh, rel.as_posix()

          print(f"Private mirror byte identity OK: {len(source_files)} files")
          PY

      - name: Commit scoped canonical backfill to branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/published/v1 web-v1-app/.private-data/published/v1 pipeline/tools/apply_l2_capacity.py pipeline/tools/regenerate_json_safe.py .github/workflows/l2-capacity-test.yml
          if git diff --cached --quiet; then
            echo "No scoped canonical data changes to commit."
          else
            git commit -m "chore(data): sync canonical L2 capacity mirrors"
            git push origin HEAD:agent/l2-capacity-canonical-backfill
          fi
