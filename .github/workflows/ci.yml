name: CI

on:
  pull_request:
    branches:
      - main
    paths-ignore:
      - "data/**"
      - "web-v1-app/.private-data/**"
  push:
    branches:
      - main
    paths-ignore:
      - "data/**"
      - "web-v1-app/.private-data/**"
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  web-v1-app:
    name: Web app quality gates
    runs-on: ubuntu-latest
    timeout-minutes: 30

    defaults:
      run:
        working-directory: ./web-v1-app

    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"
      NEXT_TELEMETRY_DISABLED: "1"
      DATABASE_URL: postgresql://ci_user:ci_password@localhost:5432/urd_atlas_ci?schema=public
      DIRECT_URL: postgresql://ci_user:ci_password@localhost:5432/urd_atlas_ci?schema=public

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web-v1-app/package-lock.json

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: npm ci

      - name: Install pipeline Python dependencies
        run: python -m pip install --upgrade pip pandas polars pyarrow fastapi starlette

      - name: Run Python regression tests
        run: cd .. && python -m unittest discover -s api -p "test_*.py"

      - name: Verify historical status text corpus
        run: |
          cd ..
          python pipeline/tools/backfill_historical_one_liner.py --check \
            --root data/published/v1/meta \
            --root web-v1-app/.private-data/published/v1/meta

      - name: Validate repository scratch-file hygiene
        run: node scripts/repo-scratch-file-check.mjs

      - name: Validate native-denomination guardrails
        run: cd .. && python pipeline/tools/validate_native_units.py --published-root data/published/v1

      - name: Audit threshold sensitivity
        run: cd .. && python pipeline/tools/audit_threshold_sensitivity.py --published-root data/published/v1 --output-json /tmp/threshold-sensitivity.json --output-csv /tmp/threshold-sensitivity.csv

      - name: Audit analog-distance robustness
        run: cd .. && python pipeline/tools/audit_analog_distance.py --published-root data/published/v1 --report /tmp/analog-distance.json

      - name: Audit longer-baseline context
        run: cd .. && python pipeline/tools/audit_baseline_context.py --published-root data/published/v1 --report /tmp/baseline-context.json

      - name: Audit conservative publication bias
        run: cd .. && python pipeline/tools/audit_conservative_bias.py

      - name: Guard feature raw-source selection
        run: cd .. && python pipeline/tools/audit_feature_source_selection.py

      - name: Guard production pipeline runner decision
        run: cd .. && python pipeline/tools/audit_pipeline_runner_contract.py

      - name: Validate independent regime-review protocol
        run: cd .. && python pipeline/tools/validate_regime_expert_review.py docs/regime-expert-review-template.csv --allow-pending

      - name: Verify public evidence-score terminology
        run: npm run check:evidence-score-terminology

      - name: Run lint
        run: npm run lint

      - name: Run typecheck
        run: npm run typecheck

      - name: Run tests
        run: npm run test

      - name: Run coverage gate
        run: npm run test:coverage

      - name: Run pipeline determinism gate
        run: npm run check:pipeline-determinism

      - name: Run pipeline environment parity gate
        run: npm run check:pipeline-environment-parity

      - name: Run pipeline golden fixture gate
        run: npm run check:pipeline-golden-fixture

      - name: Run audit gates
        run: npm run check:audit-gates:no-build

      - name: Run production build
        run: npm run build
