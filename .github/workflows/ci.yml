name: CI

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  web-v1-app:
    name: Web app quality gates
    runs-on: ubuntu-latest
    timeout-minutes: 30

    defaults:
      run:
        working-directory: ./web-v1-app

    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"
      NEXT_TELEMETRY_DISABLED: "1"
      DATABASE_URL: postgresql://ci_user:ci_password@localhost:5432/urd_atlas_ci?schema=public
      DIRECT_URL: postgresql://ci_user:ci_password@localhost:5432/urd_atlas_ci?schema=public

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web-v1-app/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run lint
        run: npm run lint

      - name: Run typecheck
        run: npm run typecheck

      - name: Run tests
        run: npm run test

      - name: Run coverage gate
        run: npm run test:coverage

      - name: Run pipeline determinism gate
        run: npm run check:pipeline-determinism

      - name: Run audit gates
        run: npm run check:audit-gates:no-build

      - name: Run production build
        run: npm run build
