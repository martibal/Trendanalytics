name: Agent targeted rebuild publish safety

on:
  push:
    branches:
      - agent/targeted-rebuild-publish-safety

permissions:
  contents: write

jobs:
  sync:
    if: "!contains(github.event.head_commit.message, '[targeted-publish-sync]')"
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/targeted-rebuild-publish-safety
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Apply targeted publish-safety change
        shell: pwsh
        run: python .agent/targeted_rebuild_publish_safety.py

      - name: Verify targeted contract
        shell: pwsh
        run: |
          python -m py_compile pipeline/tools/export_meta_json_history.py
          @'
          from pathlib import Path
          meta = Path('pipeline/tools/export_meta_json_history.py').read_text(encoding='utf-8')
          full = Path('pipeline/tools/full_pipeline.ps1').read_text(encoding='utf-8')
          assert 'ap.add_argument("--chains"' in meta
          assert 'requested_chains or list(SUPPORTED_CHAINS)' in meta
          assert '--chains $activeChainsCsv' in full
          assert full.count('--chains $publishChainsCsv') == 2
          assert "$publishChainsCsv = ($allowedChains -join ',')" in full
          print('Targeted rebuild publish-safety contract passed.')
          '@ | python -

      - name: Commit product changes
        shell: pwsh
        run: |
          Remove-Item .agent/targeted_rebuild_publish_safety.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add pipeline/tools/export_meta_json_history.py pipeline/tools/full_pipeline.ps1 .agent/targeted_rebuild_publish_safety.py
          git commit -m "Separate recompute and global publish scopes [targeted-publish-sync]"
          git push origin HEAD:agent/targeted-rebuild-publish-safety
