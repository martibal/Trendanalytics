name: Temporary ETH heating reconciliation fix

on:
  push:
    branches:
      - agent/align-ethereum-heating-reconciliation

permissions:
  contents: write

jobs:
  apply-fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/align-ethereum-heating-reconciliation
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Apply targeted fix
        run: python scripts/apply_eth_heating_reconciliation_fix.py
      - name: Install dependencies
        run: python -m pip install pandas numpy
      - name: Run focused regression tests
        run: PYTHONPATH=. python tests/test_eth_heating_reconciliation.py
      - name: Commit validated code change if needed
        shell: bash
        run: |
          if git diff --quiet -- api/regime_engine.py && [ ! -f tests/test_eth_heating_reconciliation.py ]; then
            echo "No code changes to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add api/regime_engine.py tests/test_eth_heating_reconciliation.py
          if git diff --cached --quiet; then
            echo "No staged changes to commit."
            exit 0
          fi
          git commit -m "fix: align ethereum heating reconciliation"
          git push origin HEAD:agent/align-ethereum-heating-reconciliation
