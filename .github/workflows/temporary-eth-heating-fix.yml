name: Temporary ETH heating reconciliation fix

on:
  push:
    branches:
      - agent/align-ethereum-heating-reconciliation

permissions:
  contents: read

jobs:
  build-fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Apply targeted fix in workspace
        run: python scripts/apply_eth_heating_reconciliation_fix.py
      - name: Install dependencies
        run: python -m pip install pandas numpy
      - name: Run focused regression test
        run: PYTHONPATH=. python generated-tests/test_eth_heating_reconciliation.py
      - name: Upload corrected files
        uses: actions/upload-artifact@v4
        with:
          name: eth-heating-reconciliation-fix
          path: |
            api/regime_engine.py
            generated-tests/test_eth_heating_reconciliation.py
          retention-days: 1
