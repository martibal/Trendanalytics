name: Agent Ethereum base-fee sync

on:
  push:
    branches:
      - agent/ethereum-base-fee-median

permissions:
  contents: write

jobs:
  sync:
    if: "!contains(github.event.head_commit.message, '[eth-base-fee-sync]')"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/ethereum-base-fee-median
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: web-v1-app/package-lock.json

      - name: Install Python dependencies
        run: pip install -r pipeline/requirements.txt

      - name: Install web dependencies
        working-directory: web-v1-app
        run: npm ci

      - name: Repair helper source
        shell: python
        run: |
          from pathlib import Path
          p = Path('.agent/eth_base_fee_sync.py')
          text = p.read_text(encoding='utf-8')

          bad = 'f = fixture.read_text(encoding="utf-8")nf = re.sub'
          good = 'f = fixture.read_text(encoding="utf-8")\nf = re.sub'
          if text.count(bad) != 1:
              raise SystemExit('helper line-break repair marker mismatch')
          text = text.replace(bad, good, 1)

          old_guard = '    if count != 1:\n        raise SystemExit(f"{path}: expected one match, got {count}: {old[:100]!r}")'
          new_guard = '    if count < 1:\n        raise SystemExit(f"{path}: expected at least one match, got {count}: {old[:100]!r}")'
          if text.count(old_guard) != 1:
              raise SystemExit('helper matcher guard repair marker mismatch')
          text = text.replace(old_guard, new_guard, 1)

          old_fixture = '''# Bitcoin golden fixture now also carries the new canonical null field and fix marker.\nreplace_once(FIXTURE,\n    '      block_gas_utilization_p90: 0,\\n      median_tx_fee_rate_sat_vbyte: 0,',\n    '      block_gas_utilization_p90: 0,\\n      median_block_base_fee_per_gas: 0,\\n      median_tx_fee_rate_sat_vbyte: 0,')\nreplace_once(FIXTURE,\n    '        "block_gas_utilization_p90_null_for_non_eth",\\n        "median_tx_fee_rate_sat_vbyte_null_for_non_btc",',\n    '        "block_gas_utilization_p90_null_for_non_eth",\\n        "median_block_base_fee_per_gas_null_for_non_eth",\\n        "median_tx_fee_rate_sat_vbyte_null_for_non_btc",')'''
          new_fixture = '''# Bitcoin golden fixture keeps subset metric assertions; only the exact fixes array changes.\nreplace_once(FIXTURE,\n    '    applied: ["gas_utilization_pct_null_for_btc", "block_gas_utilization_p90_null_for_non_eth"],',\n    '    applied: ["gas_utilization_pct_null_for_btc", "median_block_base_fee_per_gas_null_for_non_eth", "block_gas_utilization_p90_null_for_non_eth"],')'''
          if text.count(old_fixture) != 1:
              raise SystemExit('helper fixture-repair marker mismatch')
          text = text.replace(old_fixture, new_fixture, 1)

          p.write_text(text, encoding='utf-8')

      - name: Apply synchronized product change
        run: python .agent/eth_base_fee_sync.py

      - name: Verify targeted gates
        run: |
          python -m py_compile pipeline/src/feature_daily_agg.py pipeline/src/build_gold_timeseries.py
          cd web-v1-app
          npm run check:pipeline-golden-fixture
          npm run check:field-dictionary-sync

      - name: Commit product changes
        run: |
          rm .agent/eth_base_fee_sync.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add pipeline/src/feature_daily_agg.py pipeline/src/build_gold_timeseries.py pipeline/methodology-version.json web-v1-app/scripts/pipeline-golden-fixture.mjs web-v1-app/src/app/methodology/fields/page.tsx .agent/eth_base_fee_sync.py
          git commit -m "Add Ethereum median block base fee [eth-base-fee-sync]"
          git push origin HEAD:agent/ethereum-base-fee-median
