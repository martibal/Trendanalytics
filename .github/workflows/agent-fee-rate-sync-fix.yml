name: Fix agent fee-rate sync matcher

on:
  push:
    branches:
      - agent/bitcoin-fee-rate

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/bitcoin-fee-rate
          fetch-depth: 0

      - name: Make matcher first-occurrence safe
        shell: python
        run: |
          from pathlib import Path
          p = Path('.github/workflows/agent-fee-rate-sync.yml')
          text = p.read_text(encoding='utf-8')
          old = '''              if count != 1:\n                  raise SystemExit(f"{path}: expected exactly one match, got {count}: {old[:80]!r}")'''
          new = '''              if count < 1:\n                  raise SystemExit(f"{path}: expected at least one match, got {count}: {old[:80]!r}")'''
          if text.count(old) != 1:
              raise SystemExit('Could not find matcher guard exactly once')
          p.write_text(text.replace(old, new, 1), encoding='utf-8')

      - name: Remove matcher-fix helper and push
        run: |
          rm .github/workflows/agent-fee-rate-sync-fix.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .github/workflows/agent-fee-rate-sync.yml .github/workflows/agent-fee-rate-sync-fix.yml
          git commit -m "Fix fee-rate sync matcher [matcher-fix]"
          git push origin HEAD:agent/bitcoin-fee-rate
