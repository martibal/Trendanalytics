name: Agent Ethereum Historical Rebuild

on:
  push:
    branches:
      - agent/ethereum-history-rebuild-run
    paths:
      - .github/workflows/agent-ethereum-history-rebuild.yml

concurrency:
  group: agent-ethereum-history-rebuild
  cancel-in-progress: false

jobs:
  rebuild:
    runs-on: windows-latest
    timeout-minutes: 360
    permissions:
      contents: write
    env:
      CSS_PYTHON: python
      CSS_CHAINS: ethereum
      CSS_REBUILD_START_DATE: "2024-12-01"
      CSS_SYNC_WEB: "1"
      CSS_CLEANUP_EPHEMERAL_RAW: "1"
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

    steps:
      - name: Checkout rebuild branch
        uses: actions/checkout@v4
        with:
          ref: agent/ethereum-history-rebuild-run
          fetch-depth: 0
          persist-credentials: true
          clean: true

      - name: Configure git identity
        shell: pwsh
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Detect persisted rebuild checkpoint
        id: checkpoint
        shell: pwsh
        run: |
          $checkpoint = '.agent-state/ethereum-history-rebuild-checkpoint.json'
          if (Test-Path -LiteralPath $checkpoint) {
            Write-Host "Persisted Ethereum rebuild checkpoint found. Heavy raw/feature rebuild will be skipped."
            "exists=true" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          }
          else {
            Write-Host "No persisted checkpoint found. Heavy rebuild is required once."
            "exists=false" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          }

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install pipeline dependencies
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          pip install -r .\pipeline\requirements.txt

      - name: Stream Ethereum raw history into daily features
        if: steps.checkpoint.outputs.exists != 'true'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $start = [datetime]'2024-12-01'
          $end = (Get-Date).ToUniversalTime().Date.AddDays(-1)
          $rawRoot = Join-Path $env:GITHUB_WORKSPACE 'data\raw'
          $featuresRoot = Join-Path $env:GITHUB_WORKSPACE 'pipeline\_work\prod\features_agg'
          New-Item -ItemType Directory -Force -Path $featuresRoot | Out-Null

          function Sync-DayTable([string]$table, [string]$day, [string]$dst) {
            New-Item -ItemType Directory -Force -Path $dst | Out-Null
            $src = "s3://aws-public-blockchain/v1.0/eth/$table/date=$day/"
            $ok = $false
            for ($attempt = 1; $attempt -le 3; $attempt++) {
              Write-Host "[STREAM] $day $table attempt=$attempt"
              aws s3 sync $src $dst --no-sign-request --only-show-errors
              $parquet = @(Get-ChildItem -LiteralPath $dst -Recurse -File -Filter '*.parquet' -ErrorAction SilentlyContinue)
              if ($LASTEXITCODE -eq 0 -and $parquet.Count -gt 0) {
                $ok = $true
                break
              }
              if ($attempt -lt 3) { Start-Sleep -Seconds (2 * $attempt) }
            }
            if (-not $ok) { throw "Failed to stream $table for $day from $src" }
          }

          for ($d = $start; $d -le $end; $d = $d.AddDays(1)) {
            $day = $d.ToString('yyyy-MM-dd')
            $blockDst = Join-Path $rawRoot "ethereum\blocks\$day"
            $txDst = Join-Path $rawRoot "ethereum\transactions\$day"

            Sync-DayTable 'blocks' $day $blockDst
            Sync-DayTable 'transactions' $day $txDst

            Write-Host "[FEATURE] ethereum $day"
            python .\pipeline\src\feature_daily_agg.py --chain ethereum --date $day --raw_root $rawRoot --out_root $featuresRoot
            if ($LASTEXITCODE -ne 0) { throw "feature_daily_agg.py failed for $day" }

            # Preserve only the first raw day as the rebuild start anchor.
            if ($day -ne '2024-12-01') {
              Remove-Item -LiteralPath $blockDst -Recurse -Force -ErrorAction SilentlyContinue
              Remove-Item -LiteralPath $txDst -Recurse -Force -ErrorAction SilentlyContinue
            }
          }

          $featureCount = @(Get-ChildItem -LiteralPath (Join-Path $featuresRoot 'ethereum') -File -Filter '*.parquet').Count
          Write-Host "Streaming feature build complete: $featureCount day files"
          if ($featureCount -lt 500) { throw "Expected at least 500 Ethereum feature days; found $featureCount" }

      - name: Rebuild Gold Derived META and published artifacts from streamed features
        if: steps.checkpoint.outputs.exists != 'true'
        shell: pwsh
        run: |
          powershell -ExecutionPolicy Bypass -File .\pipeline\tools\full_pipeline.ps1 -Mode rebuild -SkipRawDownload

      - name: Restore non-Ethereum chain artifacts before checkpoint
        if: steps.checkpoint.outputs.exists != 'true'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $paths = @(
            'data/calculated/gold_json/bitcoin',
            'data/calculated/gold_json/arbitrum',
            'data/calculated/gold_json/base',
            'data/calculated/derived/bitcoin',
            'data/calculated/derived/arbitrum',
            'data/calculated/derived/base',
            'data/calculated/meta/bitcoin',
            'data/calculated/meta/arbitrum',
            'data/calculated/meta/base',
            'data/published/v1/gold/bitcoin',
            'data/published/v1/gold/arbitrum',
            'data/published/v1/gold/base',
            'data/published/v1/derived/bitcoin',
            'data/published/v1/derived/arbitrum',
            'data/published/v1/derived/base',
            'data/published/v1/meta/bitcoin',
            'data/published/v1/meta/arbitrum',
            'data/published/v1/meta/base',
            'web-v1-app/.private-data/published/v1/gold/bitcoin',
            'web-v1-app/.private-data/published/v1/gold/arbitrum',
            'web-v1-app/.private-data/published/v1/gold/base',
            'web-v1-app/.private-data/published/v1/derived/bitcoin',
            'web-v1-app/.private-data/published/v1/derived/arbitrum',
            'web-v1-app/.private-data/published/v1/derived/base',
            'web-v1-app/.private-data/published/v1/meta/bitcoin',
            'web-v1-app/.private-data/published/v1/meta/arbitrum',
            'web-v1-app/.private-data/published/v1/meta/base'
          )

          foreach ($path in $paths) {
            git restore --source=HEAD --worktree -- $path
            if ($LASTEXITCODE -ne 0) { throw "Failed to restore non-Ethereum path: $path" }
          }

          $forbidden = @(
            git diff --name-only HEAD | Where-Object {
              $_ -match '^(data/calculated/(gold_json|derived|meta)/(bitcoin|arbitrum|base)/)' -or
              $_ -match '^(data/published/v1/(gold|derived|meta)/(bitcoin|arbitrum|base)/)'
            }
          )
          if ($forbidden.Count -gt 0) {
            $forbidden | ForEach-Object { Write-Host "Unexpected canonical change remains: $_" }
            throw 'Non-Ethereum canonical restore did not fully clean the targeted rebuild.'
          }
          Write-Host 'Non-Ethereum canonical artifacts restored to pre-rebuild HEAD.'

      - name: Persist rebuilt Ethereum data checkpoint
        if: steps.checkpoint.outputs.exists != 'true'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          New-Item -ItemType Directory -Force -Path '.agent-state' | Out-Null
          @{
            chain = 'ethereum'
            start = '2024-12-01'
            created_at_utc = (Get-Date).ToUniversalTime().ToString('o')
            purpose = 'Persist heavy rebuild output before post-build validation'
          } | ConvertTo-Json | Set-Content -LiteralPath '.agent-state/ethereum-history-rebuild-checkpoint.json' -Encoding utf8

          git add -- `
            data/calculated/gold_json/ethereum `
            data/calculated/derived/ethereum `
            data/calculated/meta/ethereum `
            data/published/v1 `
            web-v1-app/.private-data/published/v1/gold/ethereum `
            web-v1-app/.private-data/published/v1/derived/ethereum `
            web-v1-app/.private-data/published/v1/meta/ethereum `
            .agent-state/ethereum-history-rebuild-checkpoint.json

          $staged = @(git diff --cached --name-only)
          if ($staged.Count -eq 0) { throw 'Heavy rebuild produced no checkpointable changes.' }

          Write-Host "Checkpointing $($staged.Count) tracked files before validation."
          git commit -m "Checkpoint rebuilt Ethereum history before validation"
          if ($LASTEXITCODE -ne 0) { throw 'Failed to create Ethereum rebuild checkpoint commit.' }
          git push origin HEAD:agent/ethereum-history-rebuild-run
          if ($LASTEXITCODE -ne 0) { throw 'Failed to push Ethereum rebuild checkpoint commit.' }

      - name: Validate Ethereum native-unit history
        shell: pwsh
        run: |
          @'
          import json
          from pathlib import Path

          roots = [
              Path("data/calculated/gold_json/ethereum"),
              Path("data/published/v1/gold/ethereum"),
              Path("web-v1-app/.private-data/published/v1/gold/ethereum"),
          ]
          fields = (
              "value_transferred_native",
              "median_tx_value_native",
              "median_tx_fee_native",
          )

          for root in roots:
              files = sorted(p for p in root.glob("*.json") if p.stem[:4].isdigit())
              if len(files) < 500:
                  raise SystemExit(f"Expected >=500 Ethereum day files in {root}, found {len(files)}")

              numeric = {field: 0 for field in fields}
              maxima = {field: 0.0 for field in fields}
              for path in files:
                  obj = json.loads(path.read_text(encoding="utf-8"))
                  for field in fields:
                      value = obj.get(field)
                      if isinstance(value, (int, float)):
                          numeric[field] += 1
                          maxima[field] = max(maxima[field], abs(float(value)))
                          if abs(float(value)) >= 1e15:
                              raise SystemExit(f"Wei-scale value remains: {root}/{path.name} {field}={value}")

              for field in fields:
                  if numeric[field] == 0:
                      raise SystemExit(f"No numeric {field} values found in {root}")

              print(root, "days=", len(files), "numeric=", numeric, "max=", maxima)
          '@ | python -

      - name: Verify non-Ethereum canonical history equals main
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          git fetch origin main --quiet
          $forbidden = @(
            git diff --name-only origin/main...HEAD | Where-Object {
              $_ -match '^(data/calculated/(gold_json|derived|meta)/(bitcoin|arbitrum|base)/)' -or
              $_ -match '^(data/published/v1/(gold|derived|meta)/(bitcoin|arbitrum|base)/)'
            }
          )
          if ($forbidden.Count -gt 0) {
            Write-Host 'Unexpected non-Ethereum canonical changes relative to main:'
            $forbidden | ForEach-Object { Write-Host "  $_" }
            throw 'Ethereum checkpoint contains non-Ethereum canonical historical changes.'
          }
          Write-Host 'Non-Ethereum canonical history matches main.'

      - name: Validate published dataset
        shell: pwsh
        run: |
          python pipeline/tools/validate_published_dataset.py --published-root data/published/v1 --chains bitcoin,ethereum,arbitrum,base --genres gold,meta,derived --windows 7,30,90,180,365
          python pipeline/tools/validate_meta_methodology_safety.py --root . --meta-root data/published/v1/meta

      - name: Show migration summary
        shell: pwsh
        run: |
          git fetch origin main --quiet
          $changed = @(git diff --name-only origin/main...HEAD)
          Write-Host "Changed tracked files versus main: $($changed.Count)"
          $changed | Group-Object { ($_ -split '/')[0..([Math]::Min(4,(($_ -split '/').Length-1)))] -join '/' } | Sort-Object Count -Descending | Select-Object -First 30 | Format-Table Count, Name -AutoSize

      - name: Mark checkpoint validated
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          if (Test-Path -LiteralPath '.agent-state/ethereum-history-rebuild-checkpoint.json') {
            Remove-Item -LiteralPath '.agent-state/ethereum-history-rebuild-checkpoint.json' -Force
            git add -u -- .agent-state/ethereum-history-rebuild-checkpoint.json
            git commit -m "Validate Ethereum historical rebuild checkpoint"
            if ($LASTEXITCODE -ne 0) { throw 'Failed to commit checkpoint validation marker removal.' }
            git push origin HEAD:agent/ethereum-history-rebuild-run
            if ($LASTEXITCODE -ne 0) { throw 'Failed to push validated checkpoint state.' }
          }
          Write-Host 'Ethereum historical rebuild checkpoint validated.'
