name: BTC Field Dictionary Fix

on:
  push:
    branches:
      - agent/btc-capacity-methodology-pr
    paths:
      - .github/workflows/btc-field-dictionary-fix.yml

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: agent/btc-capacity-methodology-pr

      - name: Apply exact Field Dictionary alignment
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          path = Path('web-v1-app/src/app/methodology/fields/page.tsx')
          s = path.read_text(encoding='utf-8')

          replacements = [
              (
                  '''        Bitcoin-only observational capacity field calculated from block weight divided by the\n        4,000,000 weight-unit consensus maximum. Published on a 0–1 scale and null for non-Bitcoin\n        chains. It is included in Gold and weekly capacity summaries, but does not yet drive the\n        public regime label, scorecard, or confidence calculation while historical behaviour is\n        being validated.''',
                  '''        Bitcoin-only capacity field calculated from block weight divided by the 4,000,000\n        weight-unit consensus maximum. Published on a 0–1 scale and null for non-Bitcoin chains.\n        It drives the BTC Capacity axis with weight 1.0 alongside block-time instability. High\n        block-weight utilization can veto a CHEAP classification, while block weight alone does\n        not create a CONGESTED classification.'''
              ),
              (
                  '''              <ul className="grid gap-2">\n                <AxisComponent field="blocktime_instability" weight="0.7" transform="instability" />\n              </ul>''',
                  '''              <ul className="grid gap-2">\n                <AxisComponent field="block_weight_utilization_pct" weight="1.0" transform="none" />\n                <AxisComponent field="blocktime_instability" weight="0.7" transform="instability" />\n              </ul>'''
              ),
              (
                  '''                    For BTC capacity interpretation, the capacity axis does not score raw block time\n                    directionally and does not combine with gas utilization. For BTC,{" "}\n                    <FieldCode>blocktime_instability</FieldCode> is the only capacity component.''',
                  '''                    For BTC capacity interpretation, the Capacity axis combines direct blockspace\n                    occupancy from <FieldCode>block_weight_utilization_pct</FieldCode> with{" "}\n                    <FieldCode>blocktime_instability</FieldCode>. Raw block time is not scored\n                    directionally, and BTC does not use gas utilization.'''
              ),
              (
                  '''                    This means the BTC capacity score is not a direct measure of slow blocks only. It is a\n                    measure of unusual block-time behaviour around the recent norm in either direction.\n                    Customers should read BTC capacity as a stress-or-instability proxy, not as a\n                    directional slow-block indicator.''',
                  '''                    BTC Capacity therefore combines blockspace occupancy with unusual block-time\n                    behaviour around the recent norm. High Capacity can veto CHEAP, but block-weight\n                    pressure alone does not create CONGESTED; simultaneous Friction pressure is also\n                    required by the BTC regime rule.'''
              ),
          ]

          for old, new in replacements:
              count = s.count(old)
              if count != 1:
                  raise SystemExit(f'expected exactly one match, found {count}: {old[:80]!r}')
              s = s.replace(old, new, 1)

          path.write_text(s, encoding='utf-8')
          PY

      - name: Run Field Dictionary sync gate
        working-directory: web-v1-app
        run: node scripts/check-field-dictionary-sync.mjs

      - name: Assert bounded diff
        shell: bash
        run: |
          set -euo pipefail
          changed=$(git status --porcelain | awk '{print $2}')
          bad=$(printf '%s\n' "$changed" | grep -v -E '^(web-v1-app/src/app/methodology/fields/page.tsx)$' || true)
          if [ -n "$bad" ]; then
            echo "Unexpected changed files:"
            echo "$bad"
            exit 1
          fi
          git diff --check

      - name: Commit Field Dictionary alignment
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add web-v1-app/src/app/methodology/fields/page.tsx
          git commit -m "docs(methodology): align BTC capacity field dictionary"
          git push origin HEAD:agent/btc-capacity-methodology-pr
